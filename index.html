<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation Works — ETABS to SAFE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F4; --surface:#FBFCFD; --surface-2:#E4E9ED; --line:#C9D2D8;
  --text:#1A2733; --text-dim:#5B6B77;
  --accent:#0F6E9C; --accent-contrast:#FFFFFF; --accent-soft:#DCEEF5;
  --rebar:#A8571F;
  --pass:#2E7D4F; --warn:#93690C; --fail:#B23A2E;
  --focus:#0F6E9C;
  --font-ui:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
  --radius:5px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181D; --surface:#1B2027; --surface-2:#232A33; --line:#313A45;
    --text:#E7ECEF; --text-dim:#8E9BA8;
    --accent:#5FC2E0; --accent-contrast:#0B1216; --accent-soft:#1E3A44;
    --rebar:#E0935A;
    --pass:#59C88A; --warn:#E0B84E; --fail:#E2685C;
    --focus:#5FC2E0;
  }
}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1B2027; --surface-2:#232A33; --line:#313A45;
  --text:#E7ECEF; --text-dim:#8E9BA8;
  --accent:#5FC2E0; --accent-contrast:#0B1216; --accent-soft:#1E3A44;
  --rebar:#E0935A;
  --pass:#59C88A; --warn:#E0B84E; --fail:#E2685C;
  --focus:#5FC2E0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-ui);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--accent-soft); color:var(--text); }
a{ color:var(--accent); }
button{ font-family:inherit; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

.app{ display:flex; min-height:100vh; }

.sidebar{
  width:270px; flex-shrink:0; background:var(--surface);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  height:100vh; position:sticky; top:0; overflow-y:auto;
}
.brand{ padding:20px 20px 14px; border-bottom:1px solid var(--line); }
.brand-mark{ font-weight:700; font-size:15px; letter-spacing:.01em; }
.brand-sub{ font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:3px; }
.nav-note{ font-size:11.5px; color:var(--text-dim); padding:12px 20px 4px; }
.nav{ padding:6px 10px 20px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px;
  border-radius:4px; cursor:pointer; border-left:2px solid transparent; color:var(--text);
}
.nav-item:hover{ background:var(--surface-2); }
.nav-item.active{ background:var(--accent-soft); border-left-color:var(--accent); }
.nav-item.active .nav-name{ color:var(--accent); font-weight:600; }
.nav-item.locked{ opacity:.6; }
.nav-num{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); width:18px; flex-shrink:0; }
.nav-name{ font-size:13px; flex:1; }
.nav-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--line); }
.nav-dot.done{ background:var(--pass); }
.nav-dot.current{ background:var(--accent); }

.main{ flex:1; min-width:0; }
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 30px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--bg); z-index:5;
}
.topbar h1{ font-size:17px; margin:0; font-weight:600; }
.module-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-top:2px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.chip{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); border:1px solid var(--line); border-radius:20px; padding:3px 10px; }
.content{ padding:26px 30px 80px; max-width:1120px; }

.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
.panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.panel-title{ font-weight:600; font-size:15px; }
.panel-hint{ color:var(--text-dim); font-size:12.5px; margin-top:4px; max-width:64ch; }

.field-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
.field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; }
.field input, .field select{
  width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--line);
  border-radius:4px; color:var(--text); font-size:13.5px; font-family:var(--font-ui);
}
.checkbox-field{ display:flex; align-items:center; gap:8px; }
.checkbox-field label{ margin:0; color:var(--text); font-size:13px; }
.checkbox-field input{ width:auto; }

.btn{
  font-weight:600; font-size:13px; padding:9px 16px; border-radius:4px;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-contrast); cursor:pointer;
}
.btn:hover{ filter:brightness(1.06); }
.btn-ghost{ background:transparent; color:var(--text); border-color:var(--line); }
.btn-sm{ padding:5px 11px; font-size:12px; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

table.data-table{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; }
.data-table th{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); color:var(--text-dim); font-family:var(--font-ui); font-weight:600; font-size:11.5px; white-space:nowrap; }
.data-table td{ padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
.data-table tr:hover td{ background:var(--surface-2); }
.table-wrap{ overflow-x:auto; }
.data-table select, .data-table input{ font-family:var(--font-mono); font-size:12px; padding:3px 6px; background:var(--bg); border:1px solid var(--line); border-radius:3px; color:var(--text); }

.badge{ display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; font-family:var(--font-mono); border:1px solid currentColor; }
.badge-pass{ color:var(--pass); } .badge-fail{ color:var(--fail); } .badge-warn{ color:var(--warn); } .badge-dim{ color:var(--text-dim); }

.log-console{ background:#0d1116; color:#c7d0d6; font-family:var(--font-mono); font-size:12.5px; padding:14px 16px; border-radius:4px; max-height:280px; overflow-y:auto; line-height:1.7; }
.log-line.fail{ color:#e2685c; } .log-line.pass{ color:#59c88a; }

.empty{ padding:34px 0 10px; max-width:52ch; }
.empty h3{ margin:0 0 8px; font-size:15px; }
.empty p{ color:var(--text-dim); font-size:13px; margin:0 0 16px; }

.plan-wrap{ border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--bg); }
.plan-toolbar{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--line); font-size:12.5px; }
.plan-toolbar label{ display:flex; align-items:center; gap:6px; color:var(--text-dim); }
.plan-svg{ display:block; width:100%; height:440px; cursor:grab; touch-action:none; }
.plan-svg:active{ cursor:grabbing; }
.plan-side{ display:flex; gap:18px; margin-top:14px; flex-wrap:wrap; }
.plan-side-panel{ flex:1; min-width:220px; }

.zone-card{ border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; }
.zone-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.zone-type{ font-family:var(--font-mono); font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:1px 7px; }

.toast{ position:fixed; bottom:20px; right:20px; background:var(--text); color:var(--bg); padding:10px 16px; border-radius:4px; font-size:13px; z-index:50; max-width:320px; }

@media (max-width: 820px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); }
  .brand{ border-bottom:none; border-right:1px solid var(--line); flex-shrink:0; }
  .nav{ display:flex; padding:10px; gap:4px; }
  .nav-note{ display:none; }
  .nav-item{ flex-direction:column; gap:4px; text-align:center; flex-shrink:0; width:78px; }
  .nav-name{ font-size:10.5px; line-height:1.2; }
  .content{ padding:18px 16px 60px; }
  .topbar{ padding:14px 16px; flex-wrap:wrap; }
  .field-grid{ grid-template-columns:1fr 1fr; }
}
@media (prefers-reduced-motion: no-preference){
  .nav-item, .btn{ transition:background .12s ease, border-color .12s ease; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Foundation Works</div>
      <div class="brand-sub">ETABS reactions → SAFE E2K</div>
    </div>
    <div class="nav-note" id="navNote"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="topTitle">Project setup</h1>
        <div class="module-label" id="topModuleLabel">MODULE 01 / 25</div>
      </div>
      <div class="chips" id="statusChips"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toastHost"></div>
<script>
'use strict';

/* ============================================================
   MODULE REGISTRY
   ============================================================ */
var MODULES = [
  {id:1,  order:1,  name:'Project setup',        phase:1},
  {id:2,  order:2,  name:'Import ETABS reactions', phase:1},
  {id:3,  order:3,  name:'Element detection',    phase:1},
  {id:4,  order:4,  name:'Reaction database',    phase:1},
  {id:26, order:5,  name:'Load combination manager', phase:1},
  {id:5,  order:6,  name:'Foundation plan',      phase:1},
  {id:6,  order:7,  name:'Condition detection',  phase:1},
  {id:7,  order:8,  name:'Foundation type',      phase:1},
  {id:8,  order:9,  name:'Auto grouping',        phase:1},
  {id:9,  order:10, name:'Manual grouping',      phase:1},
  {id:10, order:11, name:'Foundation zones',     phase:1},
  {id:11, order:12, name:'Auto sizing',          phase:1},
  {id:12, order:13, name:'Foundation design check', phase:1},
  {id:13, order:14, name:'Wall / core design',   phase:2, note:'Separate shear-wall, lift-core and combined-wall footing design, with connected walls grouped automatically.'},
  {id:14, order:15, name:'Raft design',          phase:2, note:'Multiple independent rafts, each with its own length, width, thickness, soil support, mesh and design strips.'},
  {id:15, order:16, name:'Strip design',         phase:2, note:'Multiple strips, continuous or segmented, each with its own width, thickness and reinforcement.'},
  {id:16, order:17, name:'Interaction check',    phase:2, note:'Building-wide clash check: footing/strip/raft overlap, clearances, boundary and duplicate-foundation checks.'},
  {id:17, order:18, name:'Optimization',         phase:2, note:'One-click optimize: smaller footings, better grouping, strip vs. isolated, raft zoning — subject to your approval.'},
  {id:18, order:19, name:'2D / 3D view',         phase:2, note:'Full 3D view of columns, walls, footings, strips, rafts and core with dimensions, IDs and reinforcement.'},
  {id:19, order:20, name:'Drawings',             phase:2, note:'Automatic foundation plan, footing/strip/raft sections and reinforcement details.'},
  {id:20, order:21, name:'Design summary',       phase:1},
  {id:21, order:22, name:'SAFE preview',         phase:1},
  {id:22, order:23, name:'E2K generator',        phase:2, note:"Blocked on a real sample .e2k/.f2k so the writer matches SAFE's actual table syntax instead of a guess — share one and this unlocks."},
  {id:23, order:24, name:'E2K validation',       phase:2, note:'Automatic pre-export check of units, coordinates, supports, combinations, geometry and materials.'},
  {id:24, order:25, name:'Export',               phase:2, note:'SAFE .e2k, project .json, design report PDF, foundation schedule, drawing PDF, reaction CSV.'},
  {id:25, order:26, name:'Save / load project',  phase:1}
];
var MODULES_BY_ORDER = MODULES.slice().sort(function(a,b){ return a.order-b.order; });


var STORAGE_KEY='fdnworks_project_v1';
var COVER_ASSUMED_BAR=20;
var CONCRETE_DENSITY=24;
var TAU_BD={20:1.2,25:1.4,30:1.5,35:1.7,40:1.9};
var BAR_SIZES=[10,12,16,20,25,32];

/* ============================================================
   STATE
   ============================================================ */
function defaultState(){
  return {
    project:null,
    points:[],
    reactions:[],
    loadCases:[],
    comboDefs:null,
    comboNames:null,
    selectedCombos:null,
    wallEdges:null,
    groups:[],
    zones:[],
    designs:{},
    ui:{ current:1, planView:null, selectedPoint:null, reactionFilter:'', planShowCol:true, planShowWall:true, manualSelection:[], zoneSelection:[], importWarnings:[], lastSaved:null }
  };
}
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    var parsed=JSON.parse(raw);
    if(!parsed||typeof parsed!=='object') return null;
    return parsed;
  }catch(e){ return null; }
}
var state = loadState() || defaultState();
if(!state.ui) state.ui = defaultState().ui;

var reactionIndex = {};
function rebuildReactionIndex(){
  reactionIndex = {};
  state.reactions.forEach(function(r){ reactionIndex[r.pointId+'|'+r.loadCase]=r; });
}
rebuildReactionIndex();
var conditionsCache=null;
function invalidateConditionsCache(){ conditionsCache=null; }

function saveState(){
  try{ state.ui.lastSaved=Date.now(); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ /* storage unavailable — continue without persistence */ }
}

/* ============================================================
   UTIL
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n,d){ if(n==null||isNaN(n)) return '—'; d=(d==null?2:d); return Number(n).toFixed(d); }
function shortLabel(s,max){ s=String(s); max=max||36; return s.length>max ? s.slice(0,max-1)+'…' : s; }
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
function fckOf(grade){ var m=/M?(\d+)/.exec(grade||''); return m?parseInt(m[1],10):25; }
function fyOf(grade){ var m=/Fe?(\d+)/.exec(grade||''); return m?parseInt(m[1],10):415; }
function byId(id){ return state.points.find(function(p){ return p.id===id; }); }
function toast(msg){
  var host=document.getElementById('toastHost');
  var d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  host.appendChild(d);
  setTimeout(function(){ d.remove(); },3200);
}

/* ============================================================
   IMPORT / PARSING
   ============================================================ */
function detectDelimiter(line){
  if(line.indexOf('\t')>=0) return '\t';
  var commas=(line.match(/,/g)||[]).length;
  if(commas>=2) return ',';
  return /\s+/;
}
function splitLine(line, delim){
  return (delim instanceof RegExp) ? line.trim().split(delim) : line.split(delim);
}
var HEADER_ALIASES = {
  point:['label','point','uniquename','unique name','joint','id','pointid'],
  loadcase:['outputcase','output case','loadcase','load case','case','combo','combination'],
  x:['x','xloc','globalx','coordx'],
  y:['y','yloc','globaly','coordy'],
  fx:['fx','f1'], fy:['fy','f2'], fz:['fz','f3'],
  mx:['mx','m1'], my:['my','m2'], mz:['mz','m3'],
  story:['story','level']
};
function mapHeader(cols){
  var map={};
  cols.forEach(function(raw,i){
    var c=raw.trim().toLowerCase().replace(/["']/g,'');
    for(var key in HEADER_ALIASES){
      if(HEADER_ALIASES[key].indexOf(c)>=0 && map[key]===undefined) map[key]=i;
    }
  });
  return map;
}
function parseReactionText(text){
  var warnings=[], errors=[];
  var lines=text.split(/\r?\n/).filter(function(l){ return l.trim().length>0; });
  if(lines.length<2){ errors.push('File has no data rows.'); return {points:[],reactions:[],loadCases:[],warnings:warnings,errors:errors}; }
  var delim=detectDelimiter(lines[0]);
  var headerIdx=0;
  var map=mapHeader(splitLine(lines[0],delim));
  if(map.fz===undefined && map.loadcase===undefined && lines.length>2){
    var map2=mapHeader(splitLine(lines[1],delim));
    if(map2.fz!==undefined || map2.loadcase!==undefined){ map=map2; headerIdx=1; }
  }
  if(map.fz===undefined){ errors.push('Could not find a vertical reaction column (FZ / F3) in the header.'); return {points:[],reactions:[],loadCases:[],warnings:warnings,errors:errors}; }
  var pointsMap={}, reactions=[], casesSeen=[], seenKey={};
  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  for(var i=headerIdx+1;i<lines.length;i++){
    var cols=splitLine(lines[i],delim);
    if(cols.length<2) continue;
    var pid=(map.point!==undefined?cols[map.point]:('P'+i)).toString().trim();
    if(!pid) continue;
    var lc=map.loadcase!==undefined?cols[map.loadcase].trim():'Case1';
    var fx=map.fx!==undefined?num(cols[map.fx]):0;
    var fy=map.fy!==undefined?num(cols[map.fy]):0;
    var fz=map.fz!==undefined?num(cols[map.fz]):0;
    var mx=map.mx!==undefined?num(cols[map.mx]):0;
    var my=map.my!==undefined?num(cols[map.my]):0;
    var mz=map.mz!==undefined?num(cols[map.mz]):0;
    var key=pid+'|'+lc;
    if(seenKey[key]) warnings.push('Duplicate row for '+pid+' under '+lc+' — kept the last one.');
    seenKey[key]=true;
    reactions.push({pointId:pid, loadCase:lc, fx:fx,fy:fy,fz:fz,mx:mx,my:my,mz:mz});
    if(casesSeen.indexOf(lc)<0) casesSeen.push(lc);
    if(!pointsMap[pid]){
      pointsMap[pid]={
        id:pid,
        x: map.x!==undefined?num(cols[map.x]):null,
        y: map.y!==undefined?num(cols[map.y]):null,
        type: /^w|wall|core/i.test(pid) ? 'Wall pier' : 'Column',
        colA:400, colB:400, source:'import'
      };
    }
  }
  var pts=Object.keys(pointsMap).map(function(k){ return pointsMap[k]; });
  if(pts.some(function(p){ return p.x==null; })){
    warnings.push('No X/Y coordinates found — points were arranged on a schematic grid. Edit X/Y in Element detection.');
    var n=pts.length, gcols=Math.ceil(Math.sqrt(n));
    pts.forEach(function(p,idx){ if(p.x==null){ p.x=(idx%gcols)*5; p.y=Math.floor(idx/gcols)*5; } });
  }
  if(pts.length===0) errors.push('No support points were parsed from this file.');
  return {points:pts, reactions:reactions, loadCases:casesSeen, warnings:warnings, errors:errors};
}

/* ---- CSI block / key=value format (.e2k, .f2k) ----
   SAFE's .f2k and ETABS's .e2k are the same CSI text-interchange style:
   "$ SECTION NAME" headers followed by lines of Key=Value pairs, not a
   flat delimited table. A model-only export has no force data at all —
   this only finds something when the export's tables include joint/
   support reactions (Point/Joint id + an F1..F3/FX..FZ or M1..M3/MX..MZ
   key on the same line). We key off the fields present, not a specific
   section-header string, since that varies by CSI product/version. */
function looksLikeKeyValueFormat(text){
  var sample=text.split(/\r?\n/).slice(0,80).join('\n');
  var matches=sample.match(/\b\w+=\S+/g);
  return !!matches && matches.length>5;
}
function parseKeyValueLine(line){
  var out={}, re=/(\w+)=("([^"]*)"|(\S+))/g, m;
  while((m=re.exec(line))){ out[m[1].toLowerCase()] = m[3]!==undefined?m[3]:m[4]; }
  return out;
}
function parseKeyValueBlockText(text){
  var warnings=[], errors=[];
  var lines=text.split(/\r?\n/);
  var coordMap={}, reactions=[], casesSeen=[], seenKey={};
  var ID_KEYS=['point','joint','uniquename','label'];
  var FORCE_KEYS=['f1','f2','f3','fx','fy','fz','m1','m2','m3','mx','my','mz'];
  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  lines.forEach(function(line){
    var t=line.trim();
    if(!t || t.charAt(0)==='$' || t.indexOf('=')<0) return;
    var kv=parseKeyValueLine(line);
    var idKey=null;
    for(var i=0;i<ID_KEYS.length;i++){ if(kv[ID_KEYS[i]]!==undefined){ idKey=ID_KEYS[i]; break; } }
    if(!idKey) return;
    var pid=kv[idKey];
    var hasForce=FORCE_KEYS.some(function(k){ return kv[k]!==undefined; });
    var hasCoord = kv.globalx!==undefined || kv.x!==undefined;
    if(hasCoord && !coordMap[pid]){
      coordMap[pid]={ x:num(kv.globalx!==undefined?kv.globalx:kv.x), y:num(kv.globaly!==undefined?kv.globaly:kv.y) };
    }
    if(hasForce){
      var lc=kv.outputcase||kv.loadcase||kv.case||kv.combo||'Case1';
      var fx=num(kv.fx!==undefined?kv.fx:kv.f1), fy=num(kv.fy!==undefined?kv.fy:kv.f2), fz=num(kv.fz!==undefined?kv.fz:kv.f3);
      var mx=num(kv.mx!==undefined?kv.mx:kv.m1), my=num(kv.my!==undefined?kv.my:kv.m2), mz=num(kv.mz!==undefined?kv.mz:kv.m3);
      var key=pid+'|'+lc;

  }

  var result={ L:L,B:B,D:0.5, thicknessAuto:true, qmax:qmax,qmin:qmin, governingCase:gov.bearing.lc, P:P,M1:M1,M2:M2,
    maxM1Case:gov.maxM1.lc, maxM1:gov.maxM1.v.M1, maxM2Case:gov.maxM2.lc, maxM2:gov.maxM2.v.M2,
    iterations:bIter, pass:bPass };

  if(gov.uplift){
    var upP=Math.abs(gov.uplift.v.P);
    var FOS=1.5;
    var depthCover=Math.max((parseFloat(proj.groundLevel)||0)-(parseFloat(proj.foundationLevel)||0),0.5);
    var soilDensity=parseFloat(proj.soilDensity)||18;
    var uL=L, uB=B, uD=0.5, uPass=false, uIter=[];
    for(var j=0;j<40;j++){
      var W=uL*uB*uD*CONCRETE_DENSITY + uL*uB*Math.max(depthCover-uD,0)*soilDensity;
      var uok=W>=FOS*upP;
      uIter.push({L:uL,B:uB,D:uD,value:W,target:FOS*upP,pass:uok});
      if(uok){ uPass=true; break; }
      uD=Math.round((uD+0.1)*10)/10;
      if(uD>1.8){ uL=Math.round((uL+0.2)*10)/10; uB=Math.round((uB+0.2)*10)/10; uD=0.5; }
      if(uL>8||uB>8) break;
    }
    result.L=uL; result.B=uB; result.D=uD;
    result.upliftForce=upP; result.upliftCase=gov.uplift.lc; result.upliftIterations=uIter; result.upliftPass=uPass;
    if(!uPass) result.note='Self-weight alone does not resist the uplift case within a practical size — this support needs holding-down anchors or a pile in addition to the pad.';
  }
  return result;
}

/* ============================================================
   FOUNDATION DESIGN CHECK (isolated footings get full shear/flexure;
   combined footings get bearing + eccentricity only in phase 1)
   ============================================================ */
function designCheck(group, sizing, overrideDmm){
  if(!sizing) return null;
  var proj=state.project;
  var fck=fckOf(proj.concreteGrade), fy=fyOf(proj.steelGrade);
  var cover=parseFloat(proj.cover)||50;
  var D=overrideDmm!=null ? overrideDmm : (sizing.D||0.5)*1000;
  var d=D-cover-COVER_ASSUMED_BAR;
  var L=sizing.L, B=sizing.B;
  var qavg=sizing.P/(L*B);
  var eccX=Math.abs(sizing.M2)/sizing.P, eccY=Math.abs(sizing.M1)/sizing.P;
  var result={
    fck:fck, fy:fy, D:D, d:d,
    bearing:{ qmax:sizing.qmax, qmin:sizing.qmin, sbc:parseFloat(proj.sbc), ok: sizing.qmax<=parseFloat(proj.sbc) },
    eccentricity:{ eccX:eccX, eccY:eccY, limX:L/6, limY:B/6, ok: eccX<=L/6+1e-6 && eccY<=B/6+1e-6 },
    isolated: group.memberIds.length===1,
    dirX:null, dirY:null, punching:null
  };
  if(group.memberIds.length!==1) return result;
  var p0=byId(group.memberIds[0]);
  var colA=(p0.colA||400)/1000, colB=(p0.colB||400)/1000;
  function oneWay(cantilever,width){
    var critX=cantilever-d/1000;
    if(critX<=0){
      var BwZ=width*1000, AstminZ=0.0012*BwZ*D, barZ=BAR_SIZES[1], spacingZ=300;
      for(var kz=0;kz<BAR_SIZES.length;kz++){
        var bz=BAR_SIZES[kz];
        var sz=Math.floor((Math.PI/4*bz*bz*1000/AstminZ)/10)*10;
        if(sz>=75){ barZ=bz; spacingZ=Math.min(sz,300); break; }
      }
      return {applicable:false, Ast:AstminZ, Astmin:AstminZ, bar:barZ, spacing:spacingZ, Ld:0, available:0, devOK:true, shearOK:true, Vu:0, Vc:0, cantilever:cantilever, Mu:0};
    }
    var Vu=qavg*width*critX;
    var MuKnm=qavg*width*cantilever*cantilever/2;
    var Bw=width*1000, MuNmm=MuKnm*1e6;
    var disc=1-(4.6*MuNmm)/(fck*Bw*d*d);
    var Ast = disc>0 ? 0.5*fck/fy*Bw*d*(1-Math.sqrt(disc)) : Bw*d*10;
    var Astmin=0.0012*Bw*D;
    Ast=Math.max(Ast,Astmin);
    var pt=Math.min(Math.max(100*Ast/(Bw*d),0.15),3);
    var beta=Math.max(0.8*fck/(6.89*pt),1);
    var tauc=(0.85*Math.sqrt(0.8*fck)*(Math.sqrt(1+5*beta)-1))/(6*beta);
    var Vc=tauc*Bw*d/1000;
    var bar=BAR_SIZES[1], spacing=300;
    for(var k=0;k<BAR_SIZES.length;k++){
      var b=BAR_SIZES[k];
      var s=Math.floor((Math.PI/4*b*b*1000/Ast)/10)*10;
      if(s>=75){ bar=b; spacing=Math.min(s,300); break; }
    }
    var tbdBase=TAU_BD[Math.round(fck/5)*5]||1.4;
    var Ld=(bar*0.87*fy)/(4*tbdBase*1.6);
    var available=cantilever*1000-cover;
    return {applicable:true, cantilever:cantilever, Mu:MuKnm, Ast:Ast, Astmin:Astmin, pt:pt, tauc:tauc, Vu:Vu, Vc:Vc, shearOK:Vu<=Vc, bar:bar, spacing:spacing, Ld:Ld, available:available, devOK:Ld<=available};
  }
  result.dirX=oneWay((L-colA)/2, B);
  result.dirY=oneWay((B-colB)/2, L);
  var aC=colA*1000+d, bC=colB*1000+d;
  var cond=(computeConditions()[group.memberIds[0]]||{position:'Interior'}).position;
  var b0=2*(aC+bC);
  if(cond==='Edge') b0=aC+2*bC;
  if(cond==='Corner') b0=aC+bC;
  var bc=Math.max(colA,colB)/Math.min(colA,colB);
  var ks=Math.min(0.5+bc,1.0);
  var tauPunch=ks*0.25*Math.sqrt(fck);
  var critArea=(aC/1000)*(bC/1000);
  var VuP=qavg*(L*B-critArea);
  var VcP=tauPunch*b0*d/1000;
  result.punching={ position:cond, b0:b0, Vu:VuP, Vc:VcP, ok:VuP<=VcP };
  return result;
}

var THICKNESS_SEQUENCE=[100,150,175,200,250,300,350,450,500,550,600,650,700,750,800,850,900];
function runThicknessTrials(group, sizing){
  if(group.memberIds.length!==1) return null; // combined/wall footings: full shear+flexure design is phase 2, so there's nothing here to trial against yet
  var trials=[], chosen=null;
  for(var i=0;i<THICKNESS_SEQUENCE.length;i++){
    var D=THICKNESS_SEQUENCE[i];
    var chk=designCheck(group, sizing, D);
    var punchOk=chk.punching.ok;
    var shearOk=chk.dirX.shearOK && chk.dirY.shearOK;
    var devOk=chk.dirX.devOK && chk.dirY.devOK;
    var pass=punchOk && shearOk && devOk;
    trials.push({D:D, punchOk:punchOk, shearOk:shearOk, devOk:devOk, pass:pass});
    if(pass && chosen==null) chosen=D;
  }
  return { trials:trials, chosenD: chosen!=null ? chosen : THICKNESS_SEQUENCE[THICKNESS_SEQUENCE.length-1], converged: chosen!=null };
}

function moduleHasData(id){
  switch(id){
    case 1: return !!state.project;
    case 2: return state.points.length>0;
    case 3: return state.points.length>0;
    case 4: return state.reactions.length>0;
    case 5: return state.points.length>0;
    case 6: return state.points.length>0;
    case 7: return state.points.length>0;
    case 8: return state.groups.some(function(g){return g.auto;});
    case 9: return state.groups.some(function(g){return !g.auto;});

    case 11: return Object.keys(state.designs).length>0;
    case 12: return Object.keys(state.designs).length>0;

}

function categorizeCombo(name, factors){
  var upper=name.toUpperCase();
  if(/(^|[^0-9])0\.9\s*DL/.test(upper) || /UPLIFT/.test(upper)) return 'Uplift';
  var hasSeismicWind = factors.some(function(f){ return /EQ|WIND|SPEC/i.test(f.pattern); });
  var maxFactor = factors.reduce(function(m,f){ return Math.max(m,Math.abs(f.factor)); }, 0);
  if(maxFactor<=1.0+1e-6) return 'Service';
  return hasSeismicWind ? 'Ultimate — seismic/wind' : 'Ultimate';
}
function renderLoadComboManager(){
  if(!state.comboDefs || !Object.keys(state.comboDefs).length){
    return emptyState('No load combinations in this import','Plain CSV/TXT reaction files list already-combined load cases directly, so there\'s nothing to pick here — every case is used as-is. This step matters for .e2k/.f2k imports with separate COMBO data.', 2, 'Go to import');
  }
  if(!state.selectedCombos) state.selectedCombos = (state.comboNames||[]).slice();
  var search=state.ui.comboSearch||'';
  var resolvableSet={}; (state.comboNames||[]).forEach(function(n){ resolvableSet[n]=true; });
  var selSet={}; state.selectedCombos.forEach(function(n){ selSet[n]=true; });
  var allNames=Object.keys(state.comboDefs).filter(function(n){ return state.comboDefs[n] && state.comboDefs[n].length; });
  var rows=allNames.filter(function(n){ return !search || n.toLowerCase().indexOf(search.toLowerCase())>=0; })
    .map(function(n){ return { name:n, resolvable:!!resolvableSet[n], cat: resolvableSet[n] ? categorizeCombo(n, state.comboDefs[n]) : 'Unresolvable (missing pattern data)' }; });
  var byCat={};
  rows.forEach(function(r){ (byCat[r.cat]=byCat[r.cat]||[]).push(r); });
  var catOrder=['Service','Ultimate','Ultimate — seismic/wind','Uplift','Unresolvable (missing pattern data)'];
  var html='<div class="panel"><div class="panel-head"><div><div class="panel-title">Load combination manager</div>'+
    '<div class="panel-hint">Sizing and the design check only look at what\'s ticked below — nothing runs against every combination automatically. Combinations with no transferred point-load data can\'t be evaluated and are locked off.</div></div></div>'+
    '<div class="btn-row" style="margin-top:0;"><button class="btn btn-ghost btn-sm" onclick="selectAllCombos(true)">Select all resolvable</button>'+
    '<button class="btn btn-ghost btn-sm" onclick="selectAllCombos(false)">Select none</button>'+
    '<input id="comboSearchInput" type="text" placeholder="Search combinations…" value="'+esc(search)+'" oninput="setComboSearchLive(this.value)" style="padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);font-size:13px;min-width:220px;"></div>';
  catOrder.forEach(function(cat){
    if(!byCat[cat] || !byCat[cat].length) return;
    html+='<div style="margin-top:18px;"><div style="font-weight:600;font-size:13px;margin-bottom:6px;">'+esc(cat)+' ('+byCat[cat].length+')</div>'+
      '<div class="table-wrap"><table class="data-table"><tbody>'+
      byCat[cat].map(function(r){
        var safeName=esc(r.name).replace(/'/g,'&#39;');
        return '<tr><td style="width:26px;"><input type="checkbox" '+(selSet[r.name]?'checked':'')+' '+(r.resolvable?'':'disabled')+' onchange="toggleCombo(\''+safeName+'\',this.checked)"></td>'+
          '<td title="'+esc(r.name)+'">'+esc(shortLabel(r.name,74))+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  });
  html+='<p style="font-size:12px;color:var(--text-dim);margin-top:16px;">'+state.selectedCombos.length+' of '+(state.comboNames?state.comboNames.length:0)+' resolvable combinations selected for design.</p>';
  html+='<div class="btn-row"><button class="btn" onclick="setModule(5)">Continue to foundation plan</button></div></div>';
  return html;
}
function toggleCombo(name,val){
  if(!state.selectedCombos) state.selectedCombos=(state.comboNames||[]).slice();
  if(val){ if(state.selectedCombos.indexOf(name)<0) state.selectedCombos.push(name); }
  else { state.selectedCombos=state.selectedCombos.filter(function(n){ return n!==name; }); }
  invalidateConditionsCache(); saveState(); render();
}
function selectAllCombos(all){
  state.selectedCombos = all ? (state.comboNames||[]).slice() : [];
  invalidateConditionsCache(); saveState(); render();
}
function setComboSearchLive(v){
  state.ui.comboSearch=v;
  var prevCursor=null, el=document.getElementById('comboSearchInput');
  if(el) prevCursor=el.selectionStart;
  render();
  var el2=document.getElementById('comboSearchInput');
  if(el2){ el2.focus(); if(prevCursor!=null) el2.setSelectionRange(prevCursor,prevCursor); }
}

/* ============================================================
   MODULE 5 — FOUNDATION PLAN
   ============================================================ */
function niceStep(target){
  var steps=[1,2,5,10,20,50];
  return steps.reduce(function(a,b){ return Math.abs(b-target)<Math.abs(a-target)?b:a; }, steps[0]);
}
function renderPlanGrid(){
  var v=state.ui.planView, step=niceStep(Math.max(v.w,v.h)/8);
  var lines='';
  var x0=Math.floor(v.x/step)*step, x1=v.x+v.w, y0=Math.floor(v.y/step)*step, y1=v.y+v.h;
  for(var x=x0;x<=x1;x+=step) lines+='<line x1="'+x+'" y1="'+v.y+'" x2="'+x+'" y2="'+(v.y+v.h)+'" stroke="var(--line)" stroke-width="'+(v.w/900)+'"/>';
  for(var y=y0;y<=y1;y+=step) lines+='<line x1="'+v.x+'" y1="'+y+'" x2="'+(v.x+v.w)+'" y2="'+y+'" stroke="var(--line)" stroke-width="'+(v.w/900)+'"/>';
  return '<g opacity="0.6">'+lines+'</g>';
}
function renderPlanPoint(p){
  var isWall=p.type!=='Column';
  var sz=Math.max(state.ui.planView.w,state.ui.planView.h)/60;
  var selected=state.ui.selectedPoint===p.id;
  var color=selected?'var(--accent)':(isWall?'var(--rebar)':'var(--accent)');
  var shape = isWall
    ? '<rect x="'+(p.x-sz*0.7)+'" y="'+(-p.y-sz*0.35)+'" width="'+(sz*1.4)+'" height="'+(sz*0.7)+'" fill="'+color+'" opacity="0.85"/>'
    : '<rect x="'+(p.x-sz/2)+'" y="'+(-p.y-sz/2)+'" width="'+sz+'" height="'+sz+'" fill="'+color+'" opacity="0.85"/>';
  return '<g onclick="selectPoint(\''+p.id+'\')" style="cursor:pointer;">'+shape+
    '<text x="'+(p.x+sz*0.7)+'" y="'+(-p.y+sz*0.3)+'" font-size="'+(sz*0.9)+'" font-family="IBM Plex Mono, monospace" fill="var(--text)">'+esc(p.id)+'</text></g>';
}
function renderPlanSelection(p){
  var env=envelope(p.id), g=groupOf(p.id);
  return '<div class="plan-side"><div class="plan-side-panel"><div class="panel-title" style="font-size:13px;">'+esc(p.id)+'</div>'+
    '<p style="font-size:12.5px;color:var(--text-dim);">'+esc(p.type)+' at ('+fmt(p.x,1)+', '+fmt(p.y,1)+') m'+(g?' · group '+esc(g.name):'')+'</p>'+
    (env?'<p style="font-family:var(--font-mono);font-size:12.5px;">max F3 '+fmt(env.maxFz.fz,1)+' kN ('+esc(env.maxFz.loadCase)+') · min F3 '+fmt(env.minFz.fz,1)+' kN ('+esc(env.minFz.loadCase)+')</p>':'')+
    '</div></div>';
}
function renderM5(){
  if(!state.points.length) return emptyState('No supports yet','Import ETABS reactions first.',2,'Go to import');
  var bb=bbox();
  var pad=Math.max((bb.maxX-bb.minX),(bb.maxY-bb.minY))*0.15+2;
  if(!state.ui.planView){
    state.ui.planView={x:bb.minX-pad, y:-(bb.maxY)-pad, w:(bb.maxX-bb.minX)+2*pad, h:(bb.maxY-bb.minY)+2*pad};
  }
  var sel=state.ui.selectedPoint?byId(state.ui.selectedPoint):null;
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Foundation plan</div>'+
    '<div class="panel-hint">Scroll to zoom, drag to pan, click a support for details.</div></div></div>'+
    '<div class="plan-toolbar"><label><input type="checkbox" '+(state.ui.planShowCol?'checked':'')+' onchange="togglePlanLayer(\'planShowCol\',this.checked)"> Columns</label>'+
    '<label><input type="checkbox" '+(state.ui.planShowWall?'checked':'')+' onchange="togglePlanLayer(\'planShowWall\',this.checked)"> Walls</label>'+
    '<button class="btn btn-ghost btn-sm" onclick="resetPlanView()">Reset view</button></div>'+
    '<div class="plan-wrap"><svg id="planSvg" class="plan-svg" viewBox="'+state.ui.planView.x+' '+state.ui.planView.y+' '+state.ui.planView.w+' '+state.ui.planView.h+'">'+
    renderPlanGrid()+
    state.points.filter(function(p){ return (p.type==='Column'&&state.ui.planShowCol)||(p.type!=='Column'&&state.ui.planShowWall); }).map(renderPlanPoint).join('')+
    '</svg></div>'+(sel?renderPlanSelection(sel):'')+'</div>';
}
function togglePlanLayer(key,val){ state.ui[key]=val; saveState(); render(); }
function selectPoint(id){ state.ui.selectedPoint=id; saveState(); render(); }
function resetPlanView(){ state.ui.planView=null; saveState(); render(); }
var planDrag=null;
function onPlanWheel(e){
  e.preventDefault();
  var v=state.ui.planView, rect=e.currentTarget.getBoundingClientRect();
  var mx=(e.clientX-rect.left)/rect.width, my=(e.clientY-rect.top)/rect.height;
  var scale=e.deltaY>0?1.1:0.9;
  var px=v.x+mx*v.w, py=v.y+my*v.h;
  v.w*=scale; v.h*=scale;
  v.x=px-mx*v.w; v.y=py-my*v.h;
  applyPlanView();
}
function onPlanDown(e){ planDrag={x:e.clientX,y:e.clientY,vx:state.ui.planView.x,vy:state.ui.planView.y,rect:e.currentTarget.getBoundingClientRect()}; }
function onPlanMove(e){
  if(!planDrag) return;
  var v=state.ui.planView;
  v.x=planDrag.vx-(e.clientX-planDrag.x)/planDrag.rect.width*v.w;
  v.y=planDrag.vy-(e.clientY-planDrag.y)/planDrag.rect.height*v.h;
  applyPlanView();
}
function onPlanUp(){ if(planDrag){ planDrag=null; saveState(); } }
function applyPlanView(){
  var svg=document.getElementById('planSvg'); if(!svg) return;
  var v=state.ui.planView;
  svg.setAttribute('viewBox', v.x+' '+v.y+' '+v.w+' '+v.h);
}
function wirePlan(){
  var svg=document.getElementById('planSvg'); if(!svg) return;
  svg.addEventListener('wheel', onPlanWheel, {passive:false});
  svg.addEventListener('pointerdown', onPlanDown);
}

function renameGroup(id){

function renderM8(){

function toggleManualSel(id,val){
  state.ui.manualSelection=state.ui.manualSelection||[];
  if(val) state.ui.manualSelection.push(id);
  else state.ui.manualSelection=state.ui.manualSelection.filter(function(x){return x!==id;});
  saveState(); render();
}
function createManualGroup(){
  var sel=state.ui.manualSelection||[];
  if(sel.length<1){ toast('Tick at least one support.'); return; }
  state.groups.forEach(function(g){ g.memberIds=g.memberIds.filter(function(id){return sel.indexOf(id)<0;}); });
  state.groups=state.groups.filter(function(g){return g.memberIds.length>0;});
  state.groups.push({id:uid('grp'), name:(sel.length>1?'CF-':'F-')+sel.join('+'), type: sel.length>1?'Combined':'Isolated', memberIds:sel.slice(), auto:false});
  state.ui.manualSelection=[];
  saveState(); render();
  toast('Group created.');
}
function ungroupSelected(){
  var sel=state.ui.manualSelection||[];
  state.groups.forEach(function(g){ g.memberIds=g.memberIds.filter(function(id){return sel.indexOf(id)<0;}); });
  state.groups=state.groups.filter(function(g){return g.memberIds.length>0;});
  state.ui.manualSelection=[];
  saveState(); render();
}
function renderM9(){
  if(!state.points.length) return emptyState('No supports yet','Import ETABS reactions first.',2,'Go to import');
  var checked=state.ui.manualSelection||[];
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Manual grouping</div>'+

      var g=groupOf(p.id);

function toggleZoneSel(id,val){

function updateZone(id,key,val){ var z=state.zones.find(function(x){return x.id===id;}); if(z){ z[key]=val; saveState(); render(); } }
function updateZoneField(id,key,val){ var z=state.zones.find(function(x){return x.id===id;}); if(z){ z[key]=val; saveState(); } }

/* ============================================================
   MODULE 11 — AUTO SIZING
   ============================================================ */
function runSizing(){
  state.groups.forEach(function(g){
    var sizing=sizeFooting(g);
    if(!sizing) return;
    if(!sizing.upliftForce && g.memberIds.length===1){
      var tt=runThicknessTrials(g, sizing);
      if(tt){ sizing.D=tt.chosenD/1000; sizing.thicknessTrials=tt.trials; sizing.thicknessAuto=true; sizing.thicknessConverged=tt.converged; }
    }
    state.designs[g.id]={ sizing:sizing };
  });
  saveState(); render();
  toast('Sizing complete.');
}
function updateDesignField(gid,key,val){
  if(state.designs[gid]){ state.designs[gid].sizing[key]=val; if(key==='D') state.designs[gid].sizing.thicknessAuto=false; saveState(); render(); }
}
function updateDesignFieldLive(gid,key,val){
  if(state.designs[gid]){ state.designs[gid].sizing[key]=val; if(key==='D') state.designs[gid].sizing.thicknessAuto=false; saveState(); }
}
function renderSizingResults(){
  return state.groups.filter(function(g){ return state.designs[g.id]; }).map(function(g){
    var d=state.designs[g.id].sizing;
    var bLines=d.iterations.slice(-4);
    var uLines=d.upliftIterations?d.upliftIterations.slice(-4):null;
    var overallPass = d.pass && (d.upliftIterations?d.upliftPass:true);
    var html='<div class="zone-card"><div class="zone-head"><div><strong>'+esc(g.name)+'</strong> <span class="zone-type">'+esc(g.type)+'</span></div>'+
      '<span class="badge '+(overallPass?'badge-pass':'badge-fail')+'">'+(overallPass?'sized':'not converged')+'</span></div>'+
      '<p style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-top:8px;">P '+fmt(d.P,0)+' kN under '+esc(d.governingCase)+' · SBC '+fmt(state.project.sbc,0)+' kN/m²'+
      (d.maxM1Case && d.maxM1Case!==d.governingCase?' · governing Mx '+fmt(d.maxM1,1)+' kNm under '+esc(d.maxM1Case):'')+
      (d.maxM2Case && d.maxM2Case!==d.governingCase?' · governing My '+fmt(d.maxM2,1)+' kNm under '+esc(d.maxM2Case):'')+'</p>'+
      '<div class="log-console">'+bLines.map(function(it){ return '<div class="log-line '+(it.pass?'pass':'fail')+'">'+fmt(it.L,1)+' × '+fmt(it.B,1)+' m → qmax '+fmt(it.qmax,1)+' → '+(it.pass?'PASS':'FAIL')+'</div>'; }).join('')+'</div>';
    if(uLines){
      html+='<p style="font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);margin-top:10px;">Net uplift '+fmt(d.upliftForce,1)+' kN under '+esc(d.upliftCase)+' — checking self-weight, FOS 1.5</p>'+
        '<div class="log-console">'+uLines.map(function(it){ return '<div class="log-line '+(it.pass?'pass':'fail')+'">'+fmt(it.L,1)+'×'+fmt(it.B,1)+'×'+fmt(it.D,2)+' m → weight '+fmt(it.value,0)+' / needed '+fmt(it.target,0)+' kN → '+(it.pass?'PASS':'FAIL')+'</div>'; }).join('')+'</div>';
      if(d.note) html+='<p style="font-size:12.5px;color:var(--fail);margin-top:8px;">'+esc(d.note)+'</p>';
    }
    if(d.thicknessTrials){
      html+='<p style="font-size:12.5px;color:var(--text-dim);margin-top:10px;">Trial thickness (punching · shear · dev. length):</p>'+
        '<div class="log-console">'+d.thicknessTrials.map(function(t){
          return '<div class="log-line '+(t.pass?'pass':'fail')+'">'+t.D+' mm → punching '+(t.punchOk?'OK':'FAIL')+' · shear '+(t.shearOk?'OK':'FAIL')+' · dev '+(t.devOk?'OK':'FAIL')+' → '+(t.pass?'PASS':'FAIL')+'</div>';
        }).join('')+'</div>'+
        (d.thicknessConverged===false?'<p style="font-size:12.5px;color:var(--fail);margin-top:6px;">No thickness up to 900mm passes every check — this footing needs a plan-size increase, higher concrete grade, or a pile cap rather than more depth.</p>':'');
    }
    html+='<p style="font-family:var(--font-mono);font-size:13px;margin-top:8px;">Final: '+fmt(d.L,2)+' × '+fmt(d.B,2)+' × '+fmt(d.D,2)+' m · qmax '+fmt(d.qmax,1)+' kN/m²</p>'+
      '<div class="field" style="max-width:260px;margin-top:8px;"><label>Thickness (m) — <span class="badge '+(d.thicknessAuto?'badge-dim':'badge-warn')+'" style="font-size:10px;">'+(d.thicknessAuto?'AUTO':'MANUAL OVERRIDE')+'</span></label><input type="number" step="0.05" value="'+fmt(d.D,2)+'" oninput="updateDesignFieldLive(\''+g.id+'\',\'D\',parseFloat(this.value))"></div></div>';
    return html;
  }).join('');
}
function renderM11(){
  if(!state.groups.length) return emptyState('No groups yet','Run auto grouping first.',8,'Go to grouping');
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Auto sizing</div>'+
    '<div class="panel-hint">Iterates plan size until the bearing check passes, then separately checks self-weight against any net-uplift case with a 1.5 factor of safety.</div></div></div>'+
    '<div class="btn-row" style="margin-top:0;"><button class="btn" onclick="runSizing()">Size all groups</button></div>'+
    (Object.keys(state.designs).length?renderSizingResults():'')+
    (Object.keys(state.designs).length?'<div class="btn-row"><button class="btn" onclick="setModule(12)">Continue to design check</button></div>':'')+
    '</div>';
}

/* ============================================================
   MODULE 12 — DESIGN CHECK
   ============================================================ */
function renderDesignCard(g){
  var d=state.designs[g.id].sizing;
  var chk=designCheck(g,d);
  function row(label,ok,detail){
    return '<tr><td>'+esc(label)+'</td><td><span class="badge '+(ok?'badge-pass':'badge-fail')+'">'+(ok?'OK':'CHECK')+'</span></td><td style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">'+detail+'</td></tr>';
  }
  var rows='';
  rows+=row('Bearing pressure', chk.bearing.ok, 'qmax '+fmt(chk.bearing.qmax,1)+' ≤ SBC '+fmt(chk.bearing.sbc,0)+' kN/m²');
  rows+=row('Eccentricity', chk.eccentricity.ok, 'eX '+fmt(chk.eccentricity.eccX,2)+' ≤ L/6 '+fmt(chk.eccentricity.limX,2)+' m');
  if(chk.isolated){
    rows+=row('One-way shear (X)', chk.dirX.applicable?chk.dirX.shearOK:true, chk.dirX.applicable?('Vu '+fmt(chk.dirX.Vu,0)+' ≤ Vc '+fmt(chk.dirX.Vc,0)+' kN'):'section governs at column face');
    rows+=row('One-way shear (Y)', chk.dirY.applicable?chk.dirY.shearOK:true, chk.dirY.applicable?('Vu '+fmt(chk.dirY.Vu,0)+' ≤ Vc '+fmt(chk.dirY.Vc,0)+' kN'):'section governs at column face');
    rows+=row('Punching shear', chk.punching.ok, 'Vu '+fmt(chk.punching.Vu,0)+' ≤ Vc '+fmt(chk.punching.Vc,0)+' kN ('+chk.punching.position+')');
    rows+=row('Flexure (X)', true, 'Ast '+fmt(chk.dirX.Ast,0)+' mm² → '+chk.dirX.bar+'mm @ '+chk.dirX.spacing+'mm c/c');
    rows+=row('Flexure (Y)', true, 'Ast '+fmt(chk.dirY.Ast,0)+' mm² → '+chk.dirY.bar+'mm @ '+chk.dirY.spacing+'mm c/c');
    rows+=row('Development length (X)', chk.dirX.devOK, 'Ld '+fmt(chk.dirX.Ld,0)+' mm vs '+fmt(chk.dirX.available,0)+' mm available');
  } else {
    rows+='<tr><td colspan="3" style="color:var(--text-dim);font-size:12px;">Shear, flexure and development length for combined footings — phase 2.</td></tr>';
  }
  return '<div class="zone-card"><div class="zone-head"><strong>'+esc(g.name)+'</strong><span class="zone-type">'+esc(g.type)+' · '+fmt(d.L,2)+'×'+fmt(d.B,2)+'×'+fmt(chk.D/1000,2)+' m</span></div>'+
    '<div class="table-wrap" style="margin-top:10px;"><table class="data-table"><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function renderM12(){
  var sized=state.groups.filter(function(g){ return state.designs[g.id]; });
  if(!sized.length) return emptyState('Nothing sized yet','Run auto sizing first.',11,'Go to auto sizing');
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Foundation design check</div>'+
    '<div class="panel-hint">Bearing, eccentricity, one-way shear, punching shear and flexure per '+esc(state.project.code)+'. Combined footings show bearing only here — per-column shear and flexure for those ships with wall/core and raft design in phase 2.</div></div></div>'+
    sized.map(renderDesignCard).join('')+
    '<p style="font-size:12px;color:var(--text-dim);margin-top:6px;">Preliminary sizing only — have a licensed structural engineer verify before construction.</p>'+
    '<div class="btn-row"><button class="btn" onclick="setModule(20)">Continue to design summary</button></div></div>';
}

/* ============================================================
   MODULE 20 — DESIGN SUMMARY
   ============================================================ */
function summarizeGroup(g){
  var d=state.designs[g.id].sizing;
  var chk=designCheck(g,d);
  var punchOk = chk.isolated ? chk.punching.ok : null;
  var shearOk = chk.isolated ? (chk.dirX.shearOK && chk.dirY.shearOK) : null;
  var steelX = chk.isolated ? (chk.dirX.bar+'mm@'+chk.dirX.spacing) : '—';
  var steelY = chk.isolated ? (chk.dirY.bar+'mm@'+chk.dirY.spacing) : '—';
  var overallOk = chk.bearing.ok && chk.eccentricity.ok && (punchOk===null||punchOk) && (shearOk===null||shearOk);
  return {g:g,d:d,chk:chk,punchOk:punchOk,shearOk:shearOk,steelX:steelX,steelY:steelY,overallOk:overallOk};
}
function renderM20(){
  var withDesign=state.groups.filter(function(g){ return state.designs[g.id]; });
  if(!withDesign.length) return emptyState('Nothing designed yet','Run auto sizing and the design check first.',11,'Go to auto sizing');
  var rows=withDesign.map(summarizeGroup);
  var body=rows.map(function(r){
    return '<tr><td title="'+esc(r.g.name)+'">'+esc(shortLabel(r.g.name))+'</td><td>'+esc(r.g.type)+'</td><td>'+esc(shortLabel(r.g.memberIds.join(', '),50))+'</td>'+
      '<td>'+fmt(r.d.L,2)+'×'+fmt(r.d.B,2)+'</td><td>'+fmt(r.d.D,2)+'</td><td>'+fmt(r.chk.bearing.qmax,1)+'</td>'+
      '<td>'+(r.punchOk===null?'—':(r.punchOk?'OK':'CHECK'))+'</td><td>'+(r.shearOk===null?'—':(r.shearOk?'OK':'CHECK'))+'</td>'+
      '<td style="font-family:var(--font-mono);font-size:11.5px;">'+r.steelX+' / '+r.steelY+'</td>'+
      '<td><span class="badge '+(r.overallOk?'badge-pass':'badge-fail')+'">'+(r.overallOk?'OK':'CHECK')+'</span></td></tr>';
  }).join('');
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Design summary</div>'+
    '<div class="panel-hint">One row per footing group, pulled straight from sizing and the design check — nothing recalculated here.</div></div></div>'+
    '<div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Type</th><th>Elements</th><th>Size (m)</th><th>Thk (m)</th><th>qmax</th><th>Punching</th><th>Shear</th><th>Steel X/Y</th><th>Status</th></tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="btn-row"><button class="btn btn-ghost" onclick="exportDesignSummaryCSV()">Export CSV</button><button class="btn" onclick="setModule(21)">Continue to SAFE preview</button></div></div>';
}
function exportDesignSummaryCSV(){
  var withDesign=state.groups.filter(function(g){ return state.designs[g.id]; });
  var header='Group,Type,Elements,L(m),B(m),D(m),qmax(kN per m2),Punching,Shear,SteelX,SteelY,Status\n';
  var body=withDesign.map(summarizeGroup).map(function(r){
    return [r.g.name,r.g.type,'"'+r.g.memberIds.join('+')+'"',fmt(r.d.L,2),fmt(r.d.B,2),fmt(r.d.D,2),fmt(r.chk.bearing.qmax,1),
      r.punchOk===null?'':(r.punchOk?'OK':'CHECK'), r.shearOk===null?'':(r.shearOk?'OK':'CHECK'),
      r.steelX,r.steelY, r.overallOk?'OK':'CHECK'].join(',');
  }).join('\n');
  saveFile(((state.project&&state.project.name)||'project').replace(/\s+/g,'_')+'_design_summary.csv', header+body);
}

/* ============================================================
   MODULE 21 — SAFE MODEL PREVIEW
   ============================================================ */
function renderM21(){
  if(!state.project) return emptyState('No project yet','Set up the project first.',1,'Go to project setup');
  var cols=state.points.filter(function(p){return p.type==='Column';}).length;
  var walls=state.points.filter(function(p){return p.type!=='Column';}).length;
  var isolatedCount=state.groups.filter(function(g){return g.type==='Isolated';}).length;
  var otherCount=state.groups.length-isolatedCount;
  function row(label,val){ return '<tr><td>'+esc(label)+'</td><td style="font-family:var(--font-mono);">'+esc(val)+'</td></tr>'; }
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">SAFE model preview</div>'+
    '<div class="panel-hint">What this project has right now, the way it will need to line up once it goes into SAFE. The .e2k/.f2k writer (module 22) plugs into this same data — it\'s waiting on a real sample file to match the exact table syntax, not on this data being ready.</div></div></div>'+
    '<div class="table-wrap"><table class="data-table"><tbody>'+
    row('Design code', state.project.code)+
    row('Units', state.project.units)+
    row('Concrete / steel grade', state.project.concreteGrade+' / '+state.project.steelGrade)+
    row('Supports — columns', cols)+
    row('Supports — wall piers / core', walls)+
    row('Load cases', state.loadCases.join(', ')||'—')+
    row('Footing groups — isolated', isolatedCount)+
    row('Footing groups — combined / wall / other', otherCount)+
    row('Zones', state.zones.length?state.zones.map(function(z){return z.name+' ('+z.type+')';}).join(', '):'none yet')+
    row('Soil bearing capacity', state.project.sbc+' kN/m²')+
    row('Sized footings', Object.keys(state.designs).length+' of '+state.groups.length+' groups')+
    '</tbody></table></div>'+
    '<div class="btn-row"><button class="btn btn-ghost" onclick="setModule(20)">Back to design summary</button></div></div>';
}

/* ============================================================
   MODULE 25 — SAVE / LOAD
   ============================================================ */
function exportProject(){
  saveFile((((state.project&&state.project.name)||'project').replace(/\s+/g,'_'))+'.json', JSON.stringify(state,null,2));
}
function importProject(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var parsed=JSON.parse(String(e.target.result));
      state=parsed; if(!state.ui) state.ui=defaultState().ui;
      rebuildReactionIndex(); invalidateConditionsCache();
      saveState(); render();
      toast('Project loaded.');
    }catch(err){ toast('Could not read that file — is it a project export?'); }
  };
  reader.readAsText(file);
}
function resetProjectAll(){
  if(!confirm('Start a new project? This clears the current one from this browser.')) return;
  state=defaultState(); rebuildReactionIndex(); invalidateConditionsCache(); saveState(); render();
}
function renderM25(){
  return '<div class="panel"><div class="panel-head"><div><div class="panel-title">Save / load project</div>'+
    '<div class="panel-hint">Auto-saves to this browser as you work. Export a copy to move it between devices or keep a backup.</div></div></div>'+
    '<div class="btn-row" style="margin-top:0;"><button class="btn" onclick="exportProject()">Export project (.json)</button>'+
    '<label class="btn btn-ghost" style="cursor:pointer;">Import project (.json)<input type="file" accept=".json" style="display:none" onchange="importProject(this.files[0])"></label>'+
    '<button class="btn btn-ghost" onclick="resetProjectAll()">Start a new project</button></div>'+
    '<p style="font-size:12px;color:var(--text-dim);margin-top:14px;">Local save last updated: '+(state.ui.lastSaved?new Date(state.ui.lastSaved).toLocaleString():'not yet')+'</p></div>';
}

/* ============================================================
   DOWNLOADS (published-page runtime capability, with a manual
   copy/paste fallback so an export never just silently fails)
   ============================================================ */
function saveFile(filename, content){
  if(!window.claude || typeof window.claude.use!=='function'){
    showManualExport(filename, content, 'One-tap saving needs this page open on claude.ai.');
    return;
  }
  toast('Preparing '+filename+'…');
  Promise.resolve(window.claude.use('downloads')).then(function(d){
    if(!d){ showManualExport(filename, content, "Downloads aren't available in this view."); return null; }
    return d.save({filename:filename, data:content});
  }).then(function(res){
    if(res) toast(res.status==='saved' ? 'Saved '+filename+'.' : 'Sent to your chosen destination.');
  }).catch(function(err){
    var code=err && err.code;
    if(code==='declined'){ toast('Not saved.'); return; }
    showManualExport(filename, content, 'Could not save automatically'+(code?(' — '+code):'')+'.');
  });
}
function showManualExport(filename, content, reason){
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(10,14,18,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML='<div style="background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;max-width:560px;width:100%;max-height:82vh;display:flex;flex-direction:column;">'+
    '<div style="font-weight:600;margin-bottom:4px;">'+esc(filename)+'</div>'+
    '<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px;">'+esc(reason)+' Select all in the box below and copy — or tap "Copy to clipboard".</div>'+
    '<textarea readonly style="flex:1;min-height:220px;font-family:var(--font-mono);font-size:11.5px;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);resize:vertical;">'+esc(content)+'</textarea>'+
    '<div class="btn-row"><button class="btn" id="manualCopyBtn">Copy to clipboard</button><button class="btn btn-ghost" id="manualCloseBtn">Close</button></div></div>';
  document.body.appendChild(overlay);
  var ta=overlay.querySelector('textarea');
  overlay.querySelector('#manualCopyBtn').onclick=function(){
    ta.focus(); ta.select();
    var done=false;
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(content); done=true; } }catch(e){}
    if(!done){ try{ done=document.execCommand('copy'); }catch(e){} }
    toast(done?'Copied to clipboard.':'Could not auto-copy — text is selected, use your keyboard/menu to copy.');
  };
  overlay.querySelector('#manualCloseBtn').onclick=function(){ overlay.remove(); };
}

/* ============================================================
   INIT
   ============================================================ */
window.addEventListener('pointermove', onPlanMove);
window.addEventListener('pointerup', onPlanUp);
render();
</script>
