<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundation Design Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4;
  --panel:#FFFFFF;
  --panel-raised:#E7ECF0;
  --border:#C9D3DC;
  --border-soft:#DBE2E8;
  --text:#182129;
  --text-dim:#576775;
  --text-faint:#8A98A5;
  --accent:#2E6E93;
  --accent-strong:#1F5578;
  --accent-soft:rgba(46,110,147,0.10);
  --brass:#8C6B28;
  --brass-soft:rgba(140,107,40,0.10);
  --pass:#3C7C45;
  --pass-bg:rgba(60,124,69,0.10);
  --warn:#8C6318;
  --warn-bg:rgba(140,99,24,0.10);
  --fail:#A0392F;
  --fail-bg:rgba(160,57,47,0.10);
  --radius:3px;
  --font-ui:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --plan-bg:#16232E;
  --plan-grid:rgba(148,197,222,0.14);
  --plan-grid-major:rgba(148,197,222,0.34);
  --plan-line:#BFE3F5;
  --plan-text:#E8F2F8;
  --plan-col:#5A93B4;
  --plan-col-stroke:#BFE3F5;
  --plan-wall:#83B7D6;
  --plan-footing:#E8B85B;
  --plan-ring-warn:#E0B95E;
  --plan-ring-fail:#E2857A;
  --plan-ring-info:#7FB3D1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --panel:#1A222C; --panel-raised:#212B37; --border:#2B3947; --border-soft:#212C38;
    --text:#E8ECEF; --text-dim:#8D99A6; --text-faint:#5E6A76;
    --accent:#6FA8CC; --accent-strong:#3E7EA3; --accent-soft:rgba(111,168,204,0.14);
    --brass:#CBA355; --brass-soft:rgba(203,163,85,0.12);
    --pass:#71AD79; --pass-bg:rgba(113,173,121,0.14);
    --warn:#D9A84E; --warn-bg:rgba(217,168,78,0.14);
    --fail:#CD5F55; --fail-bg:rgba(205,95,85,0.14);
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --panel:#1A222C; --panel-raised:#212B37; --border:#2B3947; --border-soft:#212C38;
  --text:#E8ECEF; --text-dim:#8D99A6; --text-faint:#5E6A76;
  --accent:#6FA8CC; --accent-strong:#3E7EA3; --accent-soft:rgba(111,168,204,0.14);
  --brass:#CBA355; --brass-soft:rgba(203,163,85,0.12);
  --pass:#71AD79; --pass-bg:rgba(113,173,121,0.14);
  --warn:#D9A84E; --warn-bg:rgba(217,168,78,0.14);
  --fail:#CD5F55; --fail-bg:rgba(205,95,85,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-ui);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{ font-family:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.app{ display:flex; flex-direction:column; min-height:100vh; }

.titleblock{
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:11px 22px; display:flex; flex-wrap:wrap; align-items:baseline; gap:18px 22px;
}
.titleblock .name{ font-size:15px; font-weight:600; color:var(--text); margin-right:4px; }
.titleblock .field{ display:flex; gap:6px; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); white-space:nowrap; }
.titleblock .field b{ color:var(--text); font-weight:500; }

.disclaimer{
  background:var(--brass-soft); border-bottom:1px solid var(--border-soft);
  border-left:3px solid var(--brass); padding:8px 22px; font-size:12.5px; color:var(--text-dim);
}
.disclaimer b{ color:var(--text); font-weight:600; }

.layout{ display:flex; flex:1; min-height:0; }

.sidebar{ width:232px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:14px 0; overflow-y:auto; }
.sidebar button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent; border:none;
  border-left:2px solid transparent; color:var(--text-dim); font-size:13.5px; padding:10px 20px; cursor:pointer;
}
.sidebar button .idx{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); min-width:18px; }
.sidebar button:hover{ background:var(--panel-raised); color:var(--text); }
.sidebar button.active{ background:var(--accent-soft); color:var(--text); border-left-color:var(--accent); font-weight:500; }
.sidebar button.active .idx{ color:var(--accent); }

.content{ flex:1; padding:26px 30px 60px; overflow-y:auto; min-width:0; }
.content h1{ font-size:20px; font-weight:600; margin:0 0 4px; }
.content .lede{ color:var(--text-dim); font-size:13.5px; margin:0 0 20px; max-width:640px; line-height:1.5; }

.panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; }
.panel h2{ font-size:13.5px; font-weight:600; color:var(--text); margin:0 0 14px; border-bottom:1px solid var(--border-soft); padding-bottom:9px; }

.form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px 16px; }
.field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; }
.field input, .field select{
  width:100%; background:var(--panel-raised); border:1px solid var(--border); color:var(--text);
  padding:9px 10px; border-radius:var(--radius); font-family:var(--font-mono); font-size:13px;
}
.field input:disabled{ color:var(--text-faint); }

.btn{
  background:var(--accent-strong); color:#F5F8FA; border:none; padding:11px 18px; border-radius:var(--radius);
  font-size:13.5px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.btn:hover{ filter:brightness(1.08); }
.btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
.btn.secondary:hover{ background:var(--panel-raised); }
.btn.small{ padding:7px 12px; font-size:12.5px; }
.btn:disabled{ opacity:0.45; cursor:not-allowed; filter:none; }
.btn-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.btn-row.small{ margin-top:8px; gap:16px; }

.hint{ font-size:12.5px; color:var(--text-dim); margin:8px 0 0; }
.note{ font-size:13px; color:var(--text-dim); }
.callout{
  border-left:3px solid var(--brass); background:var(--brass-soft); padding:12px 14px; font-size:12.8px;
  color:var(--text-dim); border-radius:0 var(--radius) var(--radius) 0; line-height:1.5;
}
.empty-state{ text-align:left; }
.empty-state p{ color:var(--text-dim); font-size:13.5px; margin:0 0 14px; }

textarea#importText{
  width:100%; background:var(--panel-raised); border:1px solid var(--border); color:var(--text);
  padding:10px 12px; border-radius:var(--radius); font-family:var(--font-mono); font-size:12.5px;
  resize:vertical; line-height:1.5;
}

.table-wrap{ overflow-x:auto; }
table.data{ width:100%; border-collapse:collapse; font-size:13px; }
table.data.compact{ font-size:12.5px; }
table.data th{
  text-align:left; font-weight:500; color:var(--text-dim); padding:8px 10px; border-bottom:1px solid var(--border);
  font-size:12px; white-space:nowrap;
}
table.data td{ padding:7px 10px; border-bottom:1px solid var(--border-soft); font-family:var(--font-mono); font-size:12.8px; white-space:nowrap; }
table.data td.num{ text-align:right; }
table.data .mono{ font-family:var(--font-mono); }
.cell-input{
  width:76px; background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text);
  padding:5px 6px; border-radius:2px; font-family:var(--font-mono); font-size:12.5px; text-align:right;
}
table.data select{
  background:var(--panel-raised); border:1px solid var(--border-soft); color:var(--text);
  padding:5px 6px; border-radius:2px; font-size:12.5px; font-family:var(--font-ui);
}

.status{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:3px; font-family:var(--font-mono); font-size:11.5px; font-weight:500; white-space:nowrap; }
.status.pass{ background:var(--pass-bg); color:var(--pass); }
.status.warn{ background:var(--warn-bg); color:var(--warn); }
.status.fail{ background:var(--fail-bg); color:var(--fail); }

.check-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.check-list li{ display:flex; gap:9px; align-items:baseline; font-size:13px; color:var(--text); }

.log-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.log-list li{ padding:7px 10px; border-left:3px solid var(--border); font-size:12.8px; background:var(--panel-raised); }
.log-list li.log-pass{ border-left-color:var(--pass); }
.log-list li.log-warn{ border-left-color:var(--warn); }
.log-list li.log-fail{ border-left-color:var(--fail); }

.plan-panel{ padding-bottom:14px; }
.plan-toolbar{ display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; margin-bottom:12px; }
.toolbar-group{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.toolbar-group input[type="text"]{
  background:var(--panel-raised); border:1px solid var(--border); color:var(--text); padding:8px 10px;
  border-radius:var(--radius); font-family:var(--font-mono); font-size:12.5px; width:150px;
}
.plan-wrap{ background:var(--plan-bg); border-radius:var(--radius); overflow:hidden; touch-action:none; border:1px solid var(--border); }
.plan-wrap.small{ margin-top:10px; }
#planSvg{ width:100%; height:420px; display:block; }
.drawing-svg{ width:100%; height:280px; display:block; }
.plan-empty{ color:var(--plan-text); opacity:0.6; font-size:13px; padding:60px 20px; text-align:center; }

.grid-minor{ stroke:var(--plan-grid); stroke-width:1; vector-effect:non-scaling-stroke; }
.grid-major{ stroke:var(--plan-grid-major); stroke-width:1; vector-effect:non-scaling-stroke; }
.col-rect{ fill:var(--plan-col); stroke:var(--plan-col-stroke); stroke-width:1.4; vector-effect:non-scaling-stroke; }
.wall-line{ stroke:var(--plan-wall); stroke-width:6; stroke-linecap:round; vector-effect:non-scaling-stroke; }
.footing-outline{ fill:none; stroke:var(--plan-footing); stroke-width:1.4; stroke-dasharray:5 4; vector-effect:non-scaling-stroke; }
.pt-label{ fill:var(--plan-text); font-family:var(--font-mono); font-size:0.34px; }
.ring{ fill:none; stroke-width:0.9; vector-effect:non-scaling-stroke; }
.ring-warn{ stroke:var(--plan-ring-warn); }
.ring-fail{ stroke:var(--plan-ring-fail); }
.ring-info{ stroke:var(--plan-ring-info); stroke-dasharray:2 1.6; }
.ring-info-soft{ stroke:var(--plan-ring-info); stroke-dasharray:1 1.4; opacity:0.7; }
.locate-ping .col-rect{ stroke:var(--plan-footing); stroke-width:2.4; }
@keyframes matIn{ from{opacity:0;} to{opacity:1;} }
.pt-mat{ opacity:0; animation:matIn 0.4s ease-out forwards; }
@media (prefers-reduced-motion:reduce){ .pt-mat{ animation:none; opacity:1; } }

.condition-toggles{ display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-size:12.8px; color:var(--text-dim); }
.condition-toggles label{ display:flex; align-items:center; gap:6px; }

.cond-summary{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; font-size:13px; }
.cond-summary li{ display:flex; gap:9px; align-items:baseline; }

.opt-row{ padding:12px 0; border-top:1px solid var(--border-soft); }
.opt-row:first-child{ border-top:none; padding-top:0; }
.opt-row p{ margin:0 0 8px; font-size:13px; }

.elev-svg{ width:100%; max-width:420px; height:150px; }
.elev-label{ fill:var(--text); font-family:var(--font-mono); font-size:0.42px; }
.elev-line-ground{ stroke:var(--text-dim); stroke-width:0.06; }
.elev-line-found{ stroke:var(--accent); stroke-width:0.06; }
.elev-line-water{ stroke:var(--fail); stroke-width:0.05; stroke-dasharray:0.2 0.15; }

.dim-line{ stroke:var(--text-dim); stroke-width:1; vector-effect:non-scaling-stroke; }
.dim-label{ fill:var(--text-dim); font-family:var(--font-mono); font-size:0.32px; }
.drawing-outline{ fill:none; stroke:var(--accent); stroke-width:1.4; vector-effect:non-scaling-stroke; }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translate(-50%,10px); background:var(--panel-raised);
  border:1px solid var(--border); padding:11px 18px; border-radius:var(--radius); font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,.22); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50;
  max-width:88vw;
}
.toast.show{ opacity:1; transform:translate(-50%,0); }

@media (max-width:780px){
  .layout{ flex-direction:column; }
  .sidebar{ width:100%; display:flex; overflow-x:auto; border-right:none; border-bottom:1px solid var(--border); padding:6px 4px; }
  .sidebar button{ flex-direction:column; align-items:flex-start; white-space:nowrap; width:auto; border-left:none; border-bottom:2px solid transparent; padding:8px 12px; gap:4px; }
  .sidebar button.active{ border-bottom-color:var(--accent); border-left-color:transparent; }
  .titleblock{ font-size:11px; padding:10px 16px; }
  .content{ padding:18px 16px 60px; }
  .form-grid{ grid-template-columns:1fr 1fr; }
}
@media (max-width:480px){
  .form-grid{ grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header class="titleblock" id="titleblock"></header>
  <div class="disclaimer"><b>Prototype:</b> sizing and design checks use simplified formulas for illustration. Have a licensed structural engineer verify any design before construction.</div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
'use strict';

/* ---------------------------------------------------------------------- */
/* State                                                                  */
/* ---------------------------------------------------------------------- */

var PHASES = {
  setup:{ idx:1, label:'Setup', lede:'Set the design code, units, soil bearing capacity, material grades and levels this project uses.' },
  import:{ idx:2, label:'Import', lede:'Bring in support reactions from ETABS, or load the sample project to explore the workflow.' },
  identify:{ idx:3, label:'Identify & reactions', lede:'Columns and walls are classified automatically, and governing reactions are listed per support.' },
  plan:{ idx:4, label:'Plan & conditions', lede:'The foundation plan, with closely-spaced, corner, edge and uplift conditions flagged.' },
  group:{ idx:5, label:'Grouping & type', lede:'Elements are grouped into foundation zones and assigned a foundation type.' },
  sizing:{ idx:6, label:'Sizing & checks', lede:'Footings are auto-sized from the governing loads, then checked for bearing, punching shear and flexure.' },
  special:{ idx:7, label:'Special foundations', lede:'Core walls, strip walls and raft zones, handled as connected groups.' },
  review:{ idx:8, label:'Review & optimize', lede:'Check for interference between foundations, and compare isolated versus combined options.' },
  output:{ idx:9, label:'Output & export', lede:'The design summary, a SAFE readiness check, and export to a SAFE-compatible E2K file.' }
};

var state = {
  phase:'setup',
  settings:{ projectName:'Meridian Plaza — Block C', code:'IS 456:2000', sbc:220, concrete:'M30', steel:'Fe500', cover:50, foundationLevel:-2.5, waterTable:-4.0 },
  points:[], groups:[], imported:false, importLog:[],
  conditions:{ closelySpaced:[], uplift:[], corner:[], edge:[] },
  showConditions:{ closelySpaced:true, uplift:true, corner:false, edge:false },
  _checkDetailId:null, _drawId:null
};

var plan = { x:-10, y:-10, w:20, h:20 };
var gridRange = { x0:-10, x1:10, y0:-10, y1:10 };
var planFitted = false;
var dragging = false, lastPt = null;
var downloadsCap = null;

/* ---------------------------------------------------------------------- */
/* Utilities                                                              */
/* ---------------------------------------------------------------------- */

function fmt(n,d){ if(d===undefined) d=1; var v=Number(n); if(Number.isNaN(v)) v=0; return v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function round1(v){ return Math.round(v*10)/10; }
function round05(v){ return Math.round(v*20)/20; }
function distance(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeSbc(s){ return (s && s.sbc>0) ? s.sbc : 150; }
function sanitizeFilename(name){ var s=String(name).trim().replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').toLowerCase(); return s||'project'; }

/* ---------------------------------------------------------------------- */
/* Sample data + import parsing                                          */
/* ---------------------------------------------------------------------- */

function buildSampleModel(){
  var xs=[0,6,12,18,24], ys=[0,5,10,15];
  var xl=['1','2','3','4','5'], yl=['A','B','C','D'];
  var points=[];
  ys.forEach(function(y,yi){
    xs.forEach(function(x,xi){
      var inCore = (yl[yi]==='B'||yl[yi]==='C') && (xl[xi]==='2'||xl[xi]==='3');
      if(inCore) return;
      var id = xl[xi]+yl[yi];
      var edgeX = xi===0||xi===xs.length-1, edgeY = yi===0||yi===ys.length-1;
      var base = 560 + (2-Math.min(xi,xs.length-1-xi))*70 + (1.5-Math.min(yi,ys.length-1-yi))*55;
      var Fz = Math.round(base);
      var FzStrength = Math.round(Fz*1.32);
      var Mx = (edgeX||edgeY) ? Math.round(16+Math.random()*12) : Math.round(4+Math.random()*5);
      var My = (edgeX||edgeY) ? Math.round(12+Math.random()*10) : Math.round(3+Math.random()*4);
      points.push({id:id, kind:'column', x:x, y:y, w:0.5, h:0.5, Fz:Fz, FzStrength:FzStrength, Mx:Mx, My:My});
    });
  });
  var extra = points.filter(function(p){return p.id==='5D';})[0];
  if(extra) points.push({id:'5D2', kind:'column', x:extra.x-1.8, y:extra.y, w:0.4, h:0.4, Fz:360, FzStrength:486, Mx:9, My:7});
  var corner = points.filter(function(p){return p.id==='1A';})[0];
  if(corner) corner.FzStrength = -42;

  var cx0=6, cx1=12, cy0=5, cy1=10;
  var coreSegs=[
    {id:'W1', from:[cx0,cy0], to:[cx1,cy0]},
    {id:'W2', from:[cx1,cy0], to:[cx1,cy1]},
    {id:'W3', from:[cx1,cy1], to:[cx0,cy1]},
    {id:'W4', from:[cx0,cy1], to:[cx0,cy0]}
  ];
  coreSegs.forEach(function(w){
    var mx=(w.from[0]+w.to[0])/2, my=(w.from[1]+w.to[1])/2;
    points.push({id:w.id, kind:'wall', x:mx, y:my, from:w.from, to:w.to, coreTag:true,
      Fz:2450+Math.round(Math.random()*260), FzStrength:3180+Math.round(Math.random()*260),
      Mx:42+Math.round(Math.random()*8), My:30+Math.round(Math.random()*8)});
  });
  var stripFrom=[12,15], stripTo=[18,15];
  var smx=(stripFrom[0]+stripTo[0])/2, smy=(stripFrom[1]+stripTo[1])/2;
  points.push({id:'W5', kind:'wall', x:smx, y:smy, from:stripFrom, to:stripTo, coreTag:false, Fz:1180, FzStrength:1550, Mx:22, My:14});

  return points;
}

function parseImportText(text){
  if(!text || !text.trim()) return null;
  var lines = text.split(/\r?\n/);
  var found = {};
  lines.forEach(function(line){
    var pm = line.match(/POINT\s+"?([\w-]+)"?\s+([\-\d.]+)\s+([\-\d.]+)/i);
    if(pm){ found[pm[1]] = Object.assign(found[pm[1]]||{}, {id:pm[1], x:parseFloat(pm[2]), y:parseFloat(pm[3])}); }
    var rm = line.match(/REACTION\s+"?([\w-]+)"?\s+FZ\s+([\-\d.]+)\s+MX\s+([\-\d.]+)\s+MY\s+([\-\d.]+)/i);
    if(rm){ found[rm[1]] = Object.assign(found[rm[1]]||{id:rm[1]}, {Fz:parseFloat(rm[2]), Mx:parseFloat(rm[3]), My:parseFloat(rm[4])}); }
  });
  var ids = Object.keys(found).filter(function(id){ return typeof found[id].x==='number' && !Number.isNaN(found[id].x); });
  if(!ids.length) return null;
  return ids.map(function(id){
    var f = found[id];
    var Fz = (typeof f.Fz==='number' && !Number.isNaN(f.Fz)) ? f.Fz : 500;
    return { id:id, kind:'column', x:f.x, y:f.y, w:0.5, h:0.5, Fz:Fz, FzStrength:Fz*1.3,
      Mx:(typeof f.Mx==='number'?f.Mx:5), My:(typeof f.My==='number'?f.My:5) };
  });
}

/* ---------------------------------------------------------------------- */
/* Classification, conditions, grouping, sizing, checks                  */
/* ---------------------------------------------------------------------- */

function classify(points){
  var cols = points.filter(function(p){return p.kind==='column';});
  if(cols.length){
    var xs=cols.map(function(p){return p.x;}), ys=cols.map(function(p){return p.y;});
    var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
    var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
    cols.forEach(function(p){
      var onX = Math.abs(p.x-minX)<1e-6 || Math.abs(p.x-maxX)<1e-6;
      var onY = Math.abs(p.y-minY)<1e-6 || Math.abs(p.y-maxY)<1e-6;
      p.classification = (onX&&onY) ? 'Corner' : (onX||onY ? 'Edge' : 'Interior');
    });
  }
  points.filter(function(p){return p.kind==='wall';}).forEach(function(p){ p.classification = p.coreTag ? 'Core wall' : 'Strip wall'; });
}

function detectConditions(points){
  var cols = points.filter(function(p){return p.kind==='column';});
  var close = {};
  for(var i=0;i<cols.length;i++){
    for(var j=i+1;j<cols.length;j++){
      if(distance(cols[i],cols[j])<3.0){ close[cols[i].id]=1; close[cols[j].id]=1; }
    }
  }
  return {
    closelySpaced:Object.keys(close),
    uplift: points.filter(function(p){return p.FzStrength<0;}).map(function(p){return p.id;}),
    corner: points.filter(function(p){return p.classification==='Corner';}).map(function(p){return p.id;}),
    edge: points.filter(function(p){return p.classification==='Edge';}).map(function(p){return p.id;})
  };
}

function autoGroup(points){
  var groups=[];
  var cols = points.filter(function(p){return p.kind==='column';});
  var walls = points.filter(function(p){return p.kind==='wall';});
  var used = {};
  cols.forEach(function(p){
    if(used[p.id]) return;
    var cluster=[p]; used[p.id]=1;
    cols.forEach(function(q){ if(!used[q.id] && distance(p,q)<3.0){ cluster.push(q); used[q.id]=1; } });
    groups.push({
      id: cluster.length>1 ? 'CMB-'+cluster.map(function(c){return c.id;}).join('/') : 'ISO-'+p.id,
      memberIds: cluster.map(function(c){return c.id;}),
      type: cluster.length>1 ? 'Combined footing' : 'Isolated footing'
    });
  });
  var coreWalls = walls.filter(function(w){return w.coreTag;});
  var otherWalls = walls.filter(function(w){return !w.coreTag;});
  if(coreWalls.length) groups.push({id:'RAFT-CORE', memberIds:coreWalls.map(function(w){return w.id;}), type:'Core raft'});
  otherWalls.forEach(function(w){ groups.push({id:'STRIP-'+w.id, memberIds:[w.id], type:'Strip / wall footing'}); });
  return groups;
}

function groupCentroid(g){
  var members = g.memberIds.map(function(id){ return state.points.filter(function(p){return p.id===id;})[0]; }).filter(Boolean);
  if(!members.length) return null;
  var x = members.reduce(function(s,p){return s+p.x;},0)/members.length;
  var y = members.reduce(function(s,p){return s+p.y;},0)/members.length;
  return {x:x,y:y};
}

function sizeFooting(group, points, settings){
  var members = group.memberIds.map(function(id){ return points.filter(function(p){return p.id===id;})[0]; }).filter(Boolean);
  var totalLoad = members.reduce(function(s,p){ return s+Math.max(p.Fz,p.FzStrength,0); },0) || 1;
  var sbc = safeSbc(settings);
  var factor = 1.15;
  var areaReq = (totalLoad*factor)/sbc;
  var L,B;
  if(group.type==='Core raft'){
    var xs = [], ys=[];
    members.forEach(function(w){ xs.push(w.from[0],w.to[0]); ys.push(w.from[1],w.to[1]); });
    var margin=1.0;
    L = (Math.max.apply(null,xs)-Math.min.apply(null,xs)) + 2*margin;
    B = (Math.max.apply(null,ys)-Math.min.apply(null,ys)) + 2*margin;
  } else if(group.type==='Strip / wall footing'){
    var w0 = members[0];
    var len = Math.hypot(w0.to[0]-w0.from[0], w0.to[1]-w0.from[1]) + 1.0;
    L = round1(len);
    B = Math.max(1.0, round1(areaReq/len));
  } else if(members.length>1){
    var mxs=members.map(function(m){return m.x;}), mys=members.map(function(m){return m.y;});
    var spreadX = Math.max.apply(null,mxs)-Math.min.apply(null,mxs)+1.2;
    var spreadY = Math.max.apply(null,mys)-Math.min.apply(null,mys)+1.2;
    L = round1(Math.max(spreadX, Math.sqrt(areaReq)));
    B = round1(Math.max(spreadY*0.6, areaReq/L, 1.0));
  } else {
    var side = round1(Math.sqrt(areaReq));
    L = side; B = side;
  }
  L = Math.max(L,1.0); B = Math.max(B,1.0);
  var t = clamp(round05(0.15 + (totalLoad/6000)), 0.45, 1.2);
  return { L:L, B:B, t:t, areaReq:areaReq, totalLoad:totalLoad };
}

function runChecks(group, size, points, settings){
  var members = group.memberIds.map(function(id){ return points.filter(function(p){return p.id===id;})[0]; }).filter(Boolean);
  var totalFzService = members.reduce(function(s,p){return s+p.Fz;},0);
  var totalFzStrength = members.reduce(function(s,p){return s+p.FzStrength;},0);
  var totalMx = members.reduce(function(s,p){return s+(p.Mx||0);},0);
  var totalMy = members.reduce(function(s,p){return s+(p.My||0);},0);

  if(totalFzStrength < 0){
    return { overall:'warn', uplift:true, totalFzStrength:totalFzStrength,
      note:'Net uplift of '+fmt(Math.abs(totalFzStrength),0)+' kN under the governing strength combination. Check anchorage and footing self-weight against pull-out rather than a bearing check.' };
  }
  var A = size.L*size.B;
  var Sx = (size.B*size.L*size.L)/6;
  var Sy = (size.L*size.B*size.B)/6;
  function pressures(totalFz){
    var pAvg = totalFz/A;
    return { max: pAvg + Math.abs(totalMx)/Sx + Math.abs(totalMy)/Sy, min: pAvg - Math.abs(totalMx)/Sx - Math.abs(totalMy)/Sy };
  }
  var svc = pressures(totalFzService), str = pressures(totalFzStrength);
  var pMax = Math.max(svc.max, str.max), pMin = Math.min(svc.min, str.min);
  var sbc = safeSbc(settings);
  var bearingRatio = pMax/sbc;
  var bearingStatus = bearingRatio<=0.9 ? 'pass' : (bearingRatio<=1.0 ? 'warn' : 'fail');

  var fck = parseInt((String(settings.concrete).match(/\d+/)||['30'])[0],10);
  var fy = parseInt((String(settings.steel).match(/\d+/)||['500'])[0],10);
  var d = Math.max(size.t - (settings.cover/1000) - 0.02, 0.1);
  var colW=0.5, colH=0.5;
  var dmm = d*1000;
  var b0 = 2*((colW*1000)+dmm) + 2*((colH*1000)+dmm);
  var vc = 0.25*Math.sqrt(fck)*b0*dmm/1000;
  var punchRatio = totalFzStrength/vc;
  var punchStatus = punchRatio<=0.75 ? 'pass' : (punchRatio<=1 ? 'warn' : 'fail');

  var cantilever = Math.max((size.L-colW)/2, (size.B-colH)/2, 0.3);
  var muPerM = pMax*cantilever*cantilever/2;
  var astReq = (muPerM*1e6)/(0.87*fy*0.9*dmm);
  var astMin = 0.0012*size.t*1000*1000;
  var astFinal = Math.max(astReq, astMin);
  var astStatus = astReq<=astMin ? 'pass' : (astReq<=astMin*1.5 ? 'warn' : 'fail');

  var overall = 'pass';
  if(bearingStatus==='fail'||punchStatus==='fail'||astStatus==='fail') overall='fail';
  else if(bearingStatus==='warn'||punchStatus==='warn'||astStatus==='warn') overall='warn';

  return { overall:overall, uplift:false, pMax:pMax, pMin:pMin, bearingRatio:bearingRatio, bearingStatus:bearingStatus,
    vc:vc, punchRatio:punchRatio, punchStatus:punchStatus, astReq:astFinal, astMin:astMin, astStatus:astStatus,
    totalFzService:totalFzService, totalFzStrength:totalFzStrength };
}

function afterImport(points){
  state.points = points;
  classify(state.points);
  state.conditions = detectConditions(state.points);
  state.groups = autoGroup(state.points).map(function(g){
    g.size = sizeFooting(g, state.points, state.settings);
    g.checks = runChecks(g, g.size, state.points, state.settings);
    return g;
  });
  state.imported = true;
  gridRange = gridRangeFromData();
  planFitted = false;
  state._checkDetailId = null;
  state._drawId = null;
}

function gridRangeFromData(){
  if(!state.points.length) return {x0:-10,x1:10,y0:-10,y1:10};
  var xs=state.points.map(function(p){return p.x;}), ys=state.points.map(function(p){return p.y;});
  return { x0:Math.floor(Math.min.apply(null,xs)-8), x1:Math.ceil(Math.max.apply(null,xs)+8),
    y0:Math.floor(Math.min.apply(null,ys)-8), y1:Math.ceil(Math.max.apply(null,ys)+8) };
}

function checkInterference(){
  var issues=[];
  var withFooting = state.groups.filter(function(g){return g.size;});
  for(var i=0;i<withFooting.length;i++){
    for(var j=i+1;j<withFooting.length;j++){
      var a=withFooting[i], b=withFooting[j];
      var ca=groupCentroid(a), cb=groupCentroid(b);
      if(!ca||!cb) continue;
      var dx=Math.abs(ca.x-cb.x), dy=Math.abs(ca.y-cb.y);
      var overlapX = dx < (a.size.L+b.size.L)/2;
      var overlapY = dy < (a.size.B+b.size.B)/2;
      if(overlapX && overlapY) issues.push(a.id+' and '+b.id+' footing outlines overlap — increase spacing or combine into one group.');
    }
  }
  return issues;
}

function validateModel(){
  var issues=[];
  var ids = state.points.map(function(p){return p.id;});
  var seen={}, dupes=[];
  ids.forEach(function(id){ if(seen[id]) dupes.push(id); seen[id]=1; });
  if(dupes.length) issues.push({level:'fail', msg:'Duplicate element IDs: '+dupes.join(', ')+'.'});
  var badCoord = state.points.filter(function(p){ return Number.isNaN(p.x)||Number.isNaN(p.y); });
  if(badCoord.length) issues.push({level:'fail', msg:badCoord.length+' element(s) missing coordinates.'});
  var ungrouped = state.points.filter(function(p){ return !state.groups.some(function(g){return g.memberIds.indexOf(p.id)>-1;}); });
  if(ungrouped.length) issues.push({level:'warn', msg:ungrouped.length+' element(s) not assigned to a foundation group: '+ungrouped.map(function(p){return p.id;}).join(', ')+'.'});
  var failing = state.groups.filter(function(g){ return g.checks && g.checks.overall==='fail'; });
  if(failing.length) issues.push({level:'fail', msg:failing.length+' group(s) failing design checks: '+failing.map(function(g){return g.id;}).join(', ')+'.'});
  var warning = state.groups.filter(function(g){ return g.checks && (g.checks.overall==='warn'||g.checks.uplift); });
  if(warning.length) issues.push({level:'warn', msg:warning.length+' group(s) flagged for review: '+warning.map(function(g){return g.id;}).join(', ')+'.'});
  if(!issues.length) issues.push({level:'pass', msg:'No missing data, duplicates, or failing checks found — ready to preview for SAFE.'});
  return issues;
}

function generateE2KText(){
  var s = state.settings;
  var lines=[];
  lines.push('$ SAFE E2K EXPORT — SIMPLIFIED SCHEMA (prototype)');
  lines.push('$ Generated by Foundation Design Console — for demonstration only. Verify field mapping against your SAFE version before importing.');
  lines.push('$ Project: '+s.projectName);
  lines.push('$ Code: '+s.code+'   Units: kN, m   SBC: '+fmt(s.sbc,0)+' kPa');
  lines.push('$ Concrete: '+s.concrete+'   Steel: '+s.steel+'   Cover: '+fmt(s.cover,0)+' mm   Foundation level: '+fmt(s.foundationLevel,1)+' m');
  lines.push('');
  lines.push('$ POINT COORDINATES');
  state.points.forEach(function(p){ lines.push('  POINT "'+p.id+'"  '+p.x.toFixed(2)+'  '+p.y.toFixed(2)); });
  lines.push('');
  lines.push('$ SUPPORT REACTIONS (governing, strength level)');
  state.points.forEach(function(p){ lines.push('  REACTION "'+p.id+'"  FZ '+p.FzStrength.toFixed(1)+'  MX '+(p.Mx||0).toFixed(1)+'  MY '+(p.My||0).toFixed(1)); });
  lines.push('');
  lines.push('$ FOUNDATION ZONES');
  state.groups.forEach(function(g){ lines.push('  ZONE "'+g.id+'"  TYPE "'+g.type+'"  MEMBERS '+g.memberIds.join(',')+'  L '+g.size.L.toFixed(2)+'  B '+g.size.B.toFixed(2)+'  T '+g.size.t.toFixed(2)); });
  lines.push('');
  lines.push('$ END — simplified export for this prototype.');
  return lines.join('\n');
}
function csvCell(v){ var s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function fmtPlain(n,d){ if(d===undefined) d=1; var v=Number(n); if(Number.isNaN(v)) v=0; return v.toFixed(d); }
function generateSummaryCSV(){
  var header=['Group','Type','L (m)','B (m)','t (m)','Pmax (kPa)','Pmin (kPa)','Punch ratio','Ast (mm2/m)','Status'];
  var rows = state.groups.map(function(g){
    var c=g.checks;
    return [g.id,g.type,fmtPlain(g.size.L,2),fmtPlain(g.size.B,2),fmtPlain(g.size.t,2),
      (c&&!c.uplift)?fmtPlain(c.pMax,1):'', (c&&!c.uplift)?fmtPlain(c.pMin,1):'',
      (c&&!c.uplift)?fmtPlain(c.punchRatio,2):'', (c&&!c.uplift)?fmtPlain(c.astReq,0):'',
      c?(c.uplift?'uplift-warn':c.overall):''];
  });
  return [header].concat(rows).map(function(r){ return r.map(csvCell).join(','); }).join('\n');
}
function generateReactionsCSV(){
  var header=['ID','Type','Classification','X (m)','Y (m)','Fz service (kN)','Fz strength (kN)','Mx (kNm)','My (kNm)','Condition'];
  var rows = state.points.map(function(p){
    return [p.id,p.kind,p.classification||'',fmtPlain(p.x,2),fmtPlain(p.y,2),fmtPlain(p.Fz,0),fmtPlain(p.FzStrength,0),fmtPlain(p.Mx||0,1),fmtPlain(p.My||0,1),(p.FzStrength<0?'Uplift':'Compression')];
  });
  return [header].concat(rows).map(function(r){ return r.map(csvCell).join(','); }).join('\n');
}

function saveProjectLocal(){
  try{ localStorage.setItem('fdc-project-v1', JSON.stringify(state)); showToast('Project saved to this browser.'); }
  catch(e){ showToast('Could not save — storage may be full or blocked.'); }
}
function loadProjectLocal(){
  try{
    var raw = localStorage.getItem('fdc-project-v1');
    if(!raw){ showToast('No saved project found in this browser.'); return; }
    var loaded = JSON.parse(raw);
    state = Object.assign({}, state, loaded);
    gridRange = gridRangeFromData();
    planFitted = false;
    showToast('Project loaded.');
  }catch(e){ showToast('Could not load the saved project.'); }
}

function fitPlan(){
  if(!state.points.length) return;
  var pad=4;
  var xs=state.points.map(function(p){return p.x;}), ys=state.points.map(function(p){return p.y;});
  var minX=Math.min.apply(null,xs)-pad, maxX=Math.max.apply(null,xs)+pad;
  var minY=Math.min.apply(null,ys)-pad, maxY=Math.max.apply(null,ys)+pad;
  plan = { x:minX, y:-maxY, w:(maxX-minX), h:(maxY-minY) };
  applyViewBoxAttr();
}
function applyViewBoxAttr(){
  var svgEl = document.getElementById('planSvg');
  if(svgEl) svgEl.setAttribute('viewBox', plan.x+' '+plan.y+' '+plan.w+' '+plan.h);
}
function zoomPlan(factor){
  var cx=plan.x+plan.w/2, cy=plan.y+plan.h/2;
  var w=clamp(plan.w*factor,4,140), h=clamp(plan.h*factor,4,140);
  plan.w=w; plan.h=h; plan.x=cx-w/2; plan.y=cy-h/2;
  applyViewBoxAttr();
}
function locatePoint(p){ plan = {x:p.x-6, y:-p.y-6, w:12, h:12}; applyViewBoxAttr(); }
function pingPoint(id){
  var svgEl = document.getElementById('planSvg');
  if(!svgEl) return;
  var els = svgEl.querySelectorAll('[data-pt-id]');
  for(var i=0;i<els.length;i++){
    if(els[i].getAttribute('data-pt-id')===id){
      (function(el){ el.classList.add('locate-ping'); setTimeout(function(){ el.classList.remove('locate-ping'); },1600); })(els[i]);
    }
  }
}
function onPointerDown(e){ dragging=true; lastPt={x:e.clientX,y:e.clientY}; }
function onPointerMove(e){
  if(!dragging) return;
  var svgEl = document.getElementById('planSvg');
  if(!svgEl) return;
  var rect = svgEl.getBoundingClientRect();
  if(!rect.width||!rect.height) return;
  var scaleX = plan.w/rect.width, scaleY = plan.h/rect.height;
  var dx=(e.clientX-lastPt.x)*scaleX, dy=(e.clientY-lastPt.y)*scaleY;
  plan.x -= dx; plan.y -= dy;
  lastPt = {x:e.clientX,y:e.clientY};
  applyViewBoxAttr();
}
function onPointerUp(){ dragging=false; lastPt=null; }
function onWheel(e){ e.preventDefault(); zoomPlan(e.deltaY>0?1.12:0.89); }
function attachPlanEvents(){
  var svgEl = document.getElementById('planSvg');
  if(!svgEl) return;
  svgEl.addEventListener('pointerdown', onPointerDown);
  svgEl.addEventListener('wheel', onWheel, {passive:false});
}

function renderPlanSVG(){
  if(!state.points.length) return '<div class="plan-empty">No elements yet — import a model to see the plan.</div>';
  var cols = state.points.filter(function(p){return p.kind==='column';});
  var walls = state.points.filter(function(p){return p.kind==='wall';});

  var gridLines='';
  for(var gx=gridRange.x0; gx<=gridRange.x1; gx++){
    var majorX = (gx%5===0);
    gridLines += '<line x1="'+gx+'" y1="'+(-gridRange.y1)+'" x2="'+gx+'" y2="'+(-gridRange.y0)+'" class="'+(majorX?'grid-major':'grid-minor')+'"/>';
  }
  for(var gy=gridRange.y0; gy<=gridRange.y1; gy++){
    var majorY = (gy%5===0);
    gridLines += '<line x1="'+gridRange.x0+'" y1="'+(-gy)+'" x2="'+gridRange.x1+'" y2="'+(-gy)+'" class="'+(majorY?'grid-major':'grid-minor')+'"/>';
  }

  var footingShapes='';
  state.groups.forEach(function(g){
    if(!g.size) return;
    var c = groupCentroid(g);
    if(!c) return;
    footingShapes += '<rect x="'+(c.x-g.size.L/2)+'" y="'+(-c.y-g.size.B/2)+'" width="'+g.size.L+'" height="'+g.size.B+'" class="footing-outline"/>';
  });

  var wallShapes = walls.map(function(w){
    return '<line data-pt-id="'+w.id+'" x1="'+w.from[0]+'" y1="'+(-w.from[1])+'" x2="'+w.to[0]+'" y2="'+(-w.to[1])+'" class="wall-line"/>';
  }).join('');

  var colShapes = cols.map(function(p,i){
    var isClose = state.showConditions.closelySpaced && state.conditions.closelySpaced.indexOf(p.id)>-1;
    var isUplift = state.showConditions.uplift && state.conditions.uplift.indexOf(p.id)>-1;
    var isCorner = state.showConditions.corner && p.classification==='Corner';
    var isEdge = state.showConditions.edge && p.classification==='Edge';
    var ring='';
    if(isClose) ring += '<circle cx="'+p.x+'" cy="'+(-p.y)+'" r="0.55" class="ring ring-warn"/>';
    if(isUplift) ring += '<circle cx="'+p.x+'" cy="'+(-p.y)+'" r="0.7" class="ring ring-fail"/>';
    if(isCorner) ring += '<circle cx="'+p.x+'" cy="'+(-p.y)+'" r="0.42" class="ring ring-info"/>';
    if(isEdge) ring += '<circle cx="'+p.x+'" cy="'+(-p.y)+'" r="0.42" class="ring ring-info-soft"/>';
    var pw=p.w||0.5, ph=p.h||0.5;
    var delay = Math.min(i*14,400);
    return '<g data-pt-id="'+p.id+'" class="pt-mat" style="animation-delay:'+delay+'ms">'+ring+
      '<rect x="'+(p.x-pw/2)+'" y="'+(-p.y-ph/2)+'" width="'+pw+'" height="'+ph+'" class="col-rect"/>'+
      '<text x="'+p.x+'" y="'+(-p.y-ph/2-0.28)+'" text-anchor="middle" class="pt-label">'+esc(p.id)+'</text>'+
      '</g>';
  }).join('');

  var vb = plan.x+' '+plan.y+' '+plan.w+' '+plan.h;
  return '<svg id="planSvg" viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet">'+
    '<g class="grid">'+gridLines+'</g>'+
    '<g class="footings">'+footingShapes+'</g>'+
    '<g class="walls">'+wallShapes+'</g>'+
    '<g class="cols">'+colShapes+'</g>'+
    '</svg>';
}

function renderDrawing(id){
  var g = state.groups.filter(function(gg){return gg.id===id;})[0];
  if(!g || !g.size) return '<p class="note">No footing selected.</p>';
  var L=g.size.L, B=g.size.B, t=g.size.t;
  var pad=0.6;
  var vbW=L+pad*2, vbH=B+pad*2+t+1.2;
  return '<svg viewBox="0 0 '+vbW+' '+vbH+'" class="drawing-svg">'+
    '<rect x="'+pad+'" y="'+pad+'" width="'+L+'" height="'+B+'" class="drawing-outline"/>'+
    '<line x1="'+pad+'" y1="'+(pad-0.15)+'" x2="'+(pad+L)+'" y2="'+(pad-0.15)+'" class="dim-line"/>'+
    '<text x="'+(pad+L/2)+'" y="'+(pad-0.25)+'" text-anchor="middle" class="dim-label">'+fmt(L,2)+' m</text>'+
    '<line x1="'+(pad-0.15)+'" y1="'+pad+'" x2="'+(pad-0.15)+'" y2="'+(pad+B)+'" class="dim-line"/>'+
    '<text x="'+(pad-0.32)+'" y="'+(pad+B/2)+'" text-anchor="middle" class="dim-label" transform="rotate(-90 '+(pad-0.32)+' '+(pad+B/2)+')">'+fmt(B,2)+' m</text>'+
    '<g transform="translate(0 '+(pad+B+0.8)+')">'+
    '<rect x="'+pad+'" y="0" width="'+L+'" height="'+t+'" class="drawing-outline"/>'+
    '<text x="'+(pad+L/2)+'" y="'+(t+0.42)+'" text-anchor="middle" class="dim-label">Section — thickness '+fmt(t,2)+' m</text>'+
    '</g></svg>';
}

function renderElevationStrip(){
  var s = state.settings;
  var gl=0, fl=s.foundationLevel, wt=s.waterTable;
  var minY=Math.min(gl,fl,wt)-1, maxY=Math.max(gl,fl,wt)+1;
  var h=maxY-minY;
  function sy(v){ return maxY-v; }
  return '<svg viewBox="0 0 12 '+h+'" class="elev-svg" preserveAspectRatio="none">'+
    '<line x1="0" y1="'+sy(gl)+'" x2="12" y2="'+sy(gl)+'" class="elev-line-ground"/>'+
    '<text x="0.3" y="'+(sy(gl)-0.25)+'" class="elev-label">Ground level 0.0 m</text>'+
    '<line x1="0" y1="'+sy(fl)+'" x2="12" y2="'+sy(fl)+'" class="elev-line-found"/>'+
    '<text x="0.3" y="'+(sy(fl)-0.25)+'" class="elev-label">Foundation level '+fmt(fl,1)+' m</text>'+
    '<line x1="0" y1="'+sy(wt)+'" x2="12" y2="'+sy(wt)+'" class="elev-line-water"/>'+
    '<text x="0.3" y="'+(sy(wt)-0.25)+'" class="elev-label">Water table '+fmt(wt,1)+' m</text>'+
    '</svg>';
}

function statusBadge(status){
  var label = status==='pass'?'Pass':status==='warn'?'Warning':'Fail';
  return '<span class="status '+status+'">'+label+'</span>';
}
function emptyState(msg){
  return '<div class="panel empty-state"><p>'+esc(msg)+'</p><button class="btn" data-action="nav" data-phase="import">Go to Import</button></div>';
}

function renderSetup(){
  var s = state.settings;
  var codes=['IS 456:2000','ACI 318-19','EC2 / BS 8110','SBC 304'];
  var concretes=['M20','M25','M30','M35','M40','M45'];
  var steels=['Fe415','Fe500','Fe550'];
  return '<div class="panel"><h2>Project settings</h2><div class="form-grid">'+
    '<div class="field"><label for="f-name">Project name</label><input id="f-name" type="text" data-bind="settings.projectName" value="'+esc(s.projectName)+'"></div>'+
    '<div class="field"><label for="f-code">Design code</label><select id="f-code" data-bind="settings.code">'+
      codes.map(function(c){ return '<option value="'+c+'" '+(s.code===c?'selected':'')+'>'+c+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="field"><label>Units</label><input type="text" value="kN · m · kPa (metric)" disabled></div>'+
    '<div class="field"><label for="f-sbc">Safe bearing capacity, SBC (kPa)</label><input id="f-sbc" type="number" step="5" data-bind="settings.sbc" value="'+s.sbc+'"></div>'+
    '<div class="field"><label for="f-conc">Concrete grade</label><select id="f-conc" data-bind="settings.concrete">'+
      concretes.map(function(c){ return '<option '+(s.concrete===c?'selected':'')+'>'+c+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="field"><label for="f-steel">Steel grade</label><select id="f-steel" data-bind="settings.steel">'+
      steels.map(function(c){ return '<option '+(s.steel===c?'selected':'')+'>'+c+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="field"><label for="f-cover">Cover (mm)</label><input id="f-cover" type="number" step="5" data-bind="settings.cover" value="'+s.cover+'"></div>'+
    '<div class="field"><label for="f-fl">Foundation level (m)</label><input id="f-fl" type="number" step="0.1" data-bind="settings.foundationLevel" value="'+s.foundationLevel+'"></div>'+
    '<div class="field"><label for="f-wt">Water table (m)</label><input id="f-wt" type="number" step="0.1" data-bind="settings.waterTable" value="'+s.waterTable+'"></div>'+
    '</div></div>'+
    '<div class="callout">These settings drive every check downstream — bearing capacity, material grades and cover feed straight into the sizing and design-check calculations. Grades are shown as fck / fy in MPa (IS-style notation) for consistency across codes in this prototype.</div>';
}

function renderImport(){
  var log = state.importLog.length ? '<div class="panel"><h2>Import log</h2><ul class="log-list">'+
    state.importLog.map(function(l){ return '<li class="log-'+l.level+'">'+esc(l.msg)+'</li>'; }).join('')+'</ul></div>' : '';
  return '<div class="panel"><h2>Import support reactions</h2>'+
    '<p class="hint">Paste reactions in the simplified demo format below, or load the sample project to see the full workflow immediately. Wall and core elements are only in the sample project — the pasted format covers column supports.</p>'+
    '<textarea id="importText" rows="6" placeholder="POINT &quot;C1&quot; 0 0&#10;REACTION &quot;C1&quot; FZ 850 MX 12 MY -8"></textarea>'+
    '<div class="btn-row"><button class="btn" data-action="parse-import">Parse & import</button>'+
    '<button class="btn secondary" data-action="load-sample">Load sample project</button></div></div>'+log;
}

function renderIdentify(){
  if(!state.imported) return emptyState('Import a model first to see identified elements and reactions here.');
  var clsOpts=['Corner','Edge','Interior','Core wall','Strip wall'];
  var rows = state.points.map(function(p){
    var uplift = p.FzStrength<0;
    return '<tr><td class="mono">'+p.id+'</td><td>'+(p.kind==='column'?'Column':'Wall')+'</td>'+
      '<td><select data-bind="points.'+p.id+'.classification">'+
        clsOpts.map(function(c){ return '<option '+(p.classification===c?'selected':'')+'>'+c+'</option>'; }).join('')+
      '</select></td>'+
      '<td class="num">'+fmt(p.x,2)+'</td><td class="num">'+fmt(p.y,2)+'</td>'+
      '<td class="num"><input type="number" class="cell-input" data-bind="points.'+p.id+'.Fz" value="'+fmt(p.Fz,0)+'" step="10"></td>'+
      '<td class="num"><input type="number" class="cell-input" data-bind="points.'+p.id+'.FzStrength" value="'+fmt(p.FzStrength,0)+'" step="10"></td>'+
      '<td class="num"><input type="number" class="cell-input" data-bind="points.'+p.id+'.Mx" value="'+fmt(p.Mx||0,1)+'" step="1"></td>'+
      '<td class="num"><input type="number" class="cell-input" data-bind="points.'+p.id+'.My" value="'+fmt(p.My||0,1)+'" step="1"></td>'+
      '<td>'+(uplift?'<span class="status fail">Uplift</span>':'<span class="status pass">Compression</span>')+'</td></tr>';
  }).join('');
  return '<div class="panel"><h2>Element identification & reactions</h2><div class="table-wrap"><table class="data">'+
    '<thead><tr><th>ID</th><th>Type</th><th>Classification</th><th>X (m)</th><th>Y (m)</th><th>Fz service (kN)</th><th>Fz strength (kN)</th><th>Mx (kNm)</th><th>My (kNm)</th><th>Condition</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+
    '<div class="btn-row"><button class="btn secondary" data-action="recalc-sizing">Recalculate sizing & checks</button></div></div>'+
    '<div class="callout">Reactions follow ETABS sign convention: positive Fz is compression (downward on the support); negative Fz is uplift. Edit values above, then recalculate.</div>';
}

function renderPlanPhase(){
  if(!state.imported) return emptyState('Import a model first to see the foundation plan here.');
  var opts = state.points.map(function(p){ return '<option value="'+p.id+'">'; }).join('');
  var cs = state.conditions;
  return '<div class="panel plan-panel"><div class="plan-toolbar">'+
    '<div class="toolbar-group"><button class="btn secondary small" data-action="plan-zoom" data-factor="0.8">Zoom in</button>'+
    '<button class="btn secondary small" data-action="plan-zoom" data-factor="1.25">Zoom out</button>'+
    '<button class="btn secondary small" data-action="plan-fit">Fit plan</button></div>'+
    '<div class="toolbar-group"><input type="text" id="locateInput" placeholder="Locate element ID…" list="pointIds"><datalist id="pointIds">'+opts+'</datalist>'+
    '<button class="btn secondary small" data-action="plan-locate">Locate</button></div></div>'+
    '<div class="plan-wrap" id="planWrap">'+renderPlanSVG()+'</div>'+
    '<div class="condition-toggles">'+
    '<label><input type="checkbox" data-action="toggle-cond" data-cond="closelySpaced" '+(state.showConditions.closelySpaced?'checked':'')+'> Closely spaced</label>'+
    '<label><input type="checkbox" data-action="toggle-cond" data-cond="uplift" '+(state.showConditions.uplift?'checked':'')+'> Uplift</label>'+
    '<label><input type="checkbox" data-action="toggle-cond" data-cond="corner" '+(state.showConditions.corner?'checked':'')+'> Corner</label>'+
    '<label><input type="checkbox" data-action="toggle-cond" data-cond="edge" '+(state.showConditions.edge?'checked':'')+'> Edge</label>'+
    '</div></div>'+
    '<div class="panel"><h2>Condition summary</h2><ul class="cond-summary">'+
    '<li>'+statusBadge('warn')+' Closely spaced — '+cs.closelySpaced.length+' element(s): '+(cs.closelySpaced.join(', ')||'none')+'</li>'+
    '<li>'+statusBadge('fail')+' Uplift — '+cs.uplift.length+' element(s): '+(cs.uplift.join(', ')||'none')+'</li>'+
    '<li>'+statusBadge('pass')+' Corner — '+cs.corner.length+' element(s)</li>'+
    '<li>'+statusBadge('pass')+' Edge — '+cs.edge.length+' element(s)</li>'+
    '</ul></div>';
}

function renderGroup(){
  if(!state.imported) return emptyState('Import a model first to see foundation groups here.');
  var typeOpts=['Isolated footing','Combined footing','Strip / wall footing','Core raft','Raft/mat','Strap footing'];
  var rows = state.groups.map(function(g){
    return '<tr><td><input type="checkbox" class="grp-check" value="'+g.id+'"></td>'+
      '<td class="mono">'+g.id+'</td><td>'+g.memberIds.join(', ')+'</td>'+
      '<td><select data-bind="groups.'+g.id+'.type">'+
        typeOpts.map(function(t){ return '<option '+(g.type===t?'selected':'')+'>'+t+'</option>'; }).join('')+
      '</select></td>'+
      '<td class="num">'+(g.size?fmt(g.size.L,2)+' × '+fmt(g.size.B,2):'—')+'</td>'+
      '<td>'+(g.memberIds.length>1?'<button class="btn secondary small" data-action="split-group" data-id="'+g.id+'">Split</button>':'')+'</td></tr>';
  }).join('');
  return '<div class="panel"><h2>Foundation groups</h2><div class="table-wrap"><table class="data">'+
    '<thead><tr><th></th><th>Group ID</th><th>Members</th><th>Foundation type</th><th>Size (m)</th><th></th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+
    '<div class="btn-row"><button class="btn secondary" data-action="merge-groups">Merge selected</button>'+
    '<button class="btn secondary" data-action="auto-group">Re-run auto grouping</button></div></div>'+
    '<div class="callout">Auto grouping combines columns closer than 3 m and treats connected wall segments as one core or strip group. Override the type, merge nearby isolated footings, or split a combined group back apart.</div>';
}

function renderCheckDetail(){
  var withChecks = state.groups.filter(function(g){return g.checks;});
  if(!withChecks.length) return '';
  var selected = (state._checkDetailId && withChecks.some(function(g){return g.id===state._checkDetailId;})) ? state._checkDetailId : withChecks[0].id;
  var opts = withChecks.map(function(g){ return '<option value="'+g.id+'" '+(g.id===selected?'selected':'')+'>'+g.id+'</option>'; }).join('');
  var g = withChecks.filter(function(x){return x.id===selected;})[0];
  var c = g.checks;
  var body;
  if(c.uplift){
    body = '<p class="note">'+esc(c.note)+'</p>';
  } else {
    body = '<ul class="check-list">'+
      '<li>'+statusBadge(c.bearingStatus)+' Bearing pressure — Pmax '+fmt(c.pMax,1)+' kPa vs SBC '+fmt(state.settings.sbc,0)+' kPa (ratio '+fmt(c.bearingRatio,2)+')</li>'+
      '<li>'+statusBadge(c.punchStatus)+' Punching shear — demand/capacity ratio '+fmt(c.punchRatio,2)+' (Vc ≈ '+fmt(c.vc,0)+' kN)</li>'+
      '<li>'+statusBadge(c.astStatus)+' Flexure — Ast required ≈ '+fmt(c.astReq,0)+' mm²/m (minimum '+fmt(c.astMin,0)+' mm²/m)</li>'+
      '</ul>';
  }
  return '<h2>Check detail — <select id="checkDetailSelect" data-action="select-check-detail">'+opts+'</select></h2>'+body;
}

function renderSizing(){
  if(!state.imported) return emptyState('Import a model first to size and check footings here.');
  var rows = state.groups.map(function(g){
    var c = g.checks;
    return '<tr><td class="mono">'+g.id+'</td><td>'+g.type+'</td>'+
      '<td class="num"><input type="number" step="0.1" class="cell-input" data-bind="groups.'+g.id+'.size.L" value="'+fmt(g.size.L,2)+'"></td>'+
      '<td class="num"><input type="number" step="0.1" class="cell-input" data-bind="groups.'+g.id+'.size.B" value="'+fmt(g.size.B,2)+'"></td>'+
      '<td class="num"><input type="number" step="0.05" class="cell-input" data-bind="groups.'+g.id+'.size.t" value="'+fmt(g.size.t,2)+'"></td>'+
      '<td class="num">'+(c&&!c.uplift?fmt(c.pMax,1):'—')+'</td>'+
      '<td class="num">'+(c&&!c.uplift?fmt(c.pMin,1):'—')+'</td>'+
      '<td>'+(c?statusBadge(c.uplift?'warn':c.overall):'')+'</td>'+
      '<td><button class="btn secondary small" data-action="recheck-group" data-id="'+g.id+'">Recheck</button></td></tr>';
  }).join('');
  return '<div class="panel"><h2>Auto footing sizing & design checks</h2><div class="table-wrap"><table class="data">'+
    '<thead><tr><th>Group</th><th>Type</th><th>L (m)</th><th>B (m)</th><th>t (m)</th><th>Pmax (kPa)</th><th>Pmin (kPa)</th><th>Status</th><th></th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+
    '<div class="btn-row"><button class="btn secondary" data-action="autosize-all">Auto-size all (reset overrides)</button></div></div>'+
    '<div class="panel" id="checkDetail">'+renderCheckDetail()+'</div>'+
    '<div class="callout">Sizing uses a preliminary area rule (governing load ÷ safe bearing capacity, factored) and a punching-perimeter thickness estimate. Bearing, punching shear and flexure use standard simplified forms for a first pass — verify final sizes and reinforcement against your design code with a licensed structural engineer before construction.</div>';
}

function renderSpecial(){
  if(!state.imported) return emptyState('Import a model first to see wall, core, strip and raft foundations here.');
  var core = state.groups.filter(function(g){return g.type==='Core raft';})[0];
  var strips = state.groups.filter(function(g){return g.type==='Strip / wall footing';});
  var coreBody;
  if(core){
    coreBody = '<p>Connected wall segments '+core.memberIds.join(', ')+' are treated as one group under a single raft, '+fmt(core.size.L,2)+' × '+fmt(core.size.B,2)+' m.</p>';
    if(core.checks && !core.checks.uplift){
      coreBody += '<ul class="check-list">'+
        '<li>'+statusBadge(core.checks.bearingStatus)+' Bearing — Pmax '+fmt(core.checks.pMax,1)+' kPa vs SBC '+fmt(state.settings.sbc,0)+' kPa</li>'+
        '<li>'+statusBadge(core.checks.punchStatus)+' Punching shear ratio '+fmt(core.checks.punchRatio,2)+'</li></ul>';
    } else if(core.checks){
      coreBody += '<p class="note">'+esc(core.checks.note)+'</p>';
    }
  } else {
    coreBody = '<p class="note">No core wall group in this project.</p>';
  }
  var stripBody = strips.length ? strips.map(function(s){
    return '<p>'+s.id+' — wall '+s.memberIds.join(', ')+', sized '+fmt(s.size.L,2)+' m long × '+fmt(s.size.B,2)+' m wide. '+statusBadge(s.checks.uplift?'warn':s.checks.overall)+'</p>';
  }).join('') : '<p class="note">No standalone wall/strip groups in this project.</p>';
  return '<div class="panel"><h2>Shear wall / lift core</h2>'+coreBody+'</div>'+
    '<div class="panel"><h2>Strip foundation</h2>'+stripBody+'</div>'+
    '<div class="panel"><h2>Raft foundation</h2><p class="note">The core raft above is sized from tributary wall loads. Full mesh, soil-spring and design-strip analysis for rafts happens in SAFE — this console prepares geometry, loads and the raft outline for that export rather than running its own finite-element analysis.</p></div>';
}

function renderOptimizeRow(g){
  var members = g.memberIds.map(function(id){ return state.points.filter(function(p){return p.id===id;})[0]; });
  var isoTotalArea = members.reduce(function(s,m){ return s + (Math.max(m.Fz,m.FzStrength)*1.15)/safeSbc(state.settings); },0);
  var isoVolume = isoTotalArea*0.5;
  var combinedArea = g.size.L*g.size.B;
  var combinedVolume = combinedArea*g.size.t;
  return '<div class="opt-row"><p><strong>'+g.id+'</strong> ('+g.memberIds.join(', ')+')</p>'+
    '<table class="data compact"><thead><tr><th></th><th>Footprint area</th><th>Concrete volume</th></tr></thead><tbody>'+
    '<tr><td>Isolated, separate</td><td class="num">'+fmt(isoTotalArea,1)+' m²</td><td class="num">'+fmt(isoVolume,1)+' m³</td></tr>'+
    '<tr><td>Combined</td><td class="num">'+fmt(combinedArea,1)+' m²</td><td class="num">'+fmt(combinedVolume,1)+' m³</td></tr>'+
    '</tbody></table><p class="hint">To use isolated footings instead, split this group from Grouping & type.</p></div>';
}

function renderReview(){
  if(!state.imported) return emptyState('Import a model first to review interference and optimization options here.');
  var interference = checkInterference();
  var combinedGroups = state.groups.filter(function(g){return g.type==='Combined footing' && g.memberIds.length>1;});
  var interferenceBody = interference.length ?
    '<ul class="check-list">'+interference.map(function(i){ return '<li>'+statusBadge('warn')+' '+esc(i)+'</li>'; }).join('')+'</ul>' :
    '<p class="note">'+statusBadge('pass')+' No overlaps or clearance violations found between footing outlines.</p>';
  var optBody = combinedGroups.length ? combinedGroups.map(renderOptimizeRow).join('') : '<p class="note">No closely-spaced clusters in this project to compare.</p>';
  return '<div class="panel"><h2>Foundation interaction check</h2>'+interferenceBody+'</div>'+
    '<div class="panel"><h2>Optimization — isolated vs combined</h2>'+optBody+'</div>'+
    '<div class="panel"><h2>2D / 3D model</h2><p class="note">The plan view (Plan & conditions) is the 2D model. A full 3D model — columns, walls, footings and rafts as solids — is beyond this prototype\'s scope; below is a schematic depth strip using the foundation and water table levels from Setup.</p>'+renderElevationStrip()+'</div>';
}

function renderOutput(){
  if(!state.imported) return emptyState('Import a model first to see the design summary and export options here.');
  var summaryRows = state.groups.map(function(g){
    var c=g.checks;
    return '<tr><td class="mono">'+g.id+'</td><td>'+g.type+'</td>'+
      '<td class="num">'+fmt(g.size.L,2)+'×'+fmt(g.size.B,2)+'×'+fmt(g.size.t,2)+'</td>'+
      '<td class="num">'+(c&&!c.uplift?fmt(c.pMax,1):'—')+'</td>'+
      '<td class="num">'+(c&&!c.uplift?fmt(c.pMin,1):'—')+'</td>'+
      '<td class="num">'+(c&&!c.uplift?fmt(c.punchRatio,2):'—')+'</td>'+
      '<td class="num">'+(c&&!c.uplift?fmt(c.astReq,0):'—')+'</td>'+
      '<td>'+(c?statusBadge(c.uplift?'warn':c.overall):'')+'</td></tr>';
  }).join('');
  var readiness = validateModel();
  var drawSel = (state._drawId && state.groups.some(function(g){return g.id===state._drawId;})) ? state._drawId : (state.groups[0] ? state.groups[0].id : null);
  var drawOpts = state.groups.map(function(g){ return '<option value="'+g.id+'" '+(g.id===drawSel?'selected':'')+'>'+g.id+'</option>'; }).join('');
  return '<div class="panel"><h2>Design summary</h2><div class="table-wrap"><table class="data">'+
    '<thead><tr><th>Group</th><th>Type</th><th>L×B×t (m)</th><th>Pmax</th><th>Pmin</th><th>Punch ratio</th><th>Ast (mm²/m)</th><th>Status</th></tr></thead>'+
    '<tbody>'+summaryRows+'</tbody></table></div></div>'+
    '<div class="panel"><h2>Drawing preview</h2><select id="drawSelect" data-action="select-drawing">'+drawOpts+'</select>'+
    '<div class="plan-wrap small" id="drawWrap">'+(drawSel?renderDrawing(drawSel):'')+'</div>'+
    '<p class="hint">Schematic plan and section for the selected group — dimensions only, not full reinforcement detailing.</p></div>'+
    '<div class="panel"><h2>SAFE preview & validation</h2><ul class="check-list">'+
    readiness.map(function(r){ return '<li>'+statusBadge(r.level)+' '+esc(r.msg)+'</li>'; }).join('')+
    '</ul><div class="btn-row"><button class="btn secondary" data-action="validate">Re-validate</button></div></div>'+
    '<div class="panel"><h2>Export</h2><div class="btn-row">'+
    '<button class="btn js-download" data-action="download-e2k" disabled>Download SAFE E2K (.txt)</button>'+
    '<button class="btn secondary js-download" data-action="download-summary" disabled>Download design summary (.csv)</button>'+
    '<button class="btn secondary js-download" data-action="download-reactions" disabled>Download reactions (.csv)</button>'+
    '</div><p class="hint">The E2K export uses a simplified schema for this prototype — check field mapping against your SAFE version before importing.</p></div>'+
    '<div class="panel"><h2>Save / load project</h2><div class="btn-row">'+
    '<button class="btn secondary" data-action="save-project">Save to this browser</button>'+
    '<button class="btn secondary" data-action="load-project">Load saved project</button>'+
    '</div><p class="hint">Saved locally in this browser only — not shared with anyone else who opens this page.</p></div>';
}

function renderSidebar(){
  var nav = document.getElementById('sidebar');
  var keys = Object.keys(PHASES);
  nav.innerHTML = keys.map(function(key){
    var p = PHASES[key];
    var idxStr = (p.idx<10?'0':'')+p.idx;
    return '<button data-action="nav" data-phase="'+key+'" class="'+(state.phase===key?'active':'')+'"><span class="idx">'+idxStr+'</span>'+p.label+'</button>';
  }).join('');
}
function renderPhase(){
  renderSidebar();
  var p = PHASES[state.phase];
  var content = document.getElementById('content');
  var body='';
  switch(state.phase){
    case 'setup': body=renderSetup(); break;
    case 'import': body=renderImport(); break;
    case 'identify': body=renderIdentify(); break;
    case 'plan': body=renderPlanPhase(); break;
    case 'group': body=renderGroup(); break;
    case 'sizing': body=renderSizing(); break;
    case 'special': body=renderSpecial(); break;
    case 'review': body=renderReview(); break;
    case 'output': body=renderOutput(); break;
  }
  content.innerHTML = '<h1>'+p.label+'</h1><p class="lede">'+p.lede+'</p>'+body;
  content.scrollTop = 0;
  if(state.phase==='plan'){
    if(!planFitted){ fitPlan(); planFitted=true; }
    attachPlanEvents();
  }
  refreshDownloadButtons();
}
function renderAll(){ renderTitleblock(); renderPhase(); }

/* ---------------------------------------------------------------------- */
/* Data binding                                                          */
/* ---------------------------------------------------------------------- */

function setPath(path, value){
  var parts = path.split('.');
  if(parts[0]==='settings'){ state.settings[parts[1]] = value; }
  else if(parts[0]==='points'){
    var p = state.points.filter(function(pp){return pp.id===parts[1];})[0];
    if(p) p[parts[2]] = value;
  } else if(parts[0]==='groups'){
    var g = state.groups.filter(function(gg){return gg.id===parts[1];})[0];
    if(g){
      if(parts[2]==='size'){ g.size[parts[3]] = value; g.manualSize = true; }
      else g[parts[2]] = value;
    }
  }
}
function handleBind(el){
  var path = el.dataset.bind;
  if(!path) return;
  var raw = el.value, value;
  if(el.type==='number'){ value = parseFloat(raw); if(Number.isNaN(value)) value = 0; }
  else { value = raw; }
  setPath(path, value);
  if(path.indexOf('settings.')===0) renderTitleblock();
}

/* ---------------------------------------------------------------------- */
/* Actions                                                                */
/* ---------------------------------------------------------------------- */

function handleAction(action, el){
  switch(action){
    case 'nav': state.phase = el.dataset.phase; renderPhase(); break;
    case 'parse-import': {
      var text = document.getElementById('importText').value;
      var parsed = parseImportText(text);
      if(parsed && parsed.length){
        afterImport(parsed);
        state.importLog = [{level:'pass', msg:'Imported '+parsed.length+' point(s) from pasted text.'}];
      } else {
        afterImport(buildSampleModel());
        state.importLog = [{level:'warn', msg:'No recognizable reactions found in the pasted text — loaded the sample project instead so you can explore the workflow.'}];
      }
      renderPhase();
      break;
    }
    case 'load-sample': {
      var model = buildSampleModel();
      afterImport(model);
      var nCol = model.filter(function(p){return p.kind==='column';}).length;
      var nWall = model.filter(function(p){return p.kind==='wall';}).length;
      state.importLog = [{level:'pass', msg:'Sample project loaded: '+nCol+' columns and '+nWall+' wall segments.'}];
      renderPhase();
      break;
    }
    case 'recalc-sizing': {
      state.groups.forEach(function(g){
        var size = g.manualSize ? g.size : sizeFooting(g, state.points, state.settings);
        g.size = size;
        g.checks = runChecks(g, size, state.points, state.settings);
      });
      showToast('Sizing and checks recalculated from current reactions.');
      renderPhase();
      break;
    }
    case 'merge-groups': {
      var checkedEls = document.querySelectorAll('.grp-check:checked');
      var checked = Array.prototype.map.call(checkedEls, function(c){return c.value;});
      if(checked.length<2){ showToast('Select two or more groups to merge.'); break; }
      var merging = state.groups.filter(function(g){return checked.indexOf(g.id)>-1;});
      var allWalls = merging.every(function(g){ return g.type==='Core raft'||g.type==='Strip / wall footing'; });
      if(allWalls){ showToast('Wall groups already represent connected segments — merge isolated column footings instead.'); break; }
      var memberIds = [];
      merging.forEach(function(g){ memberIds = memberIds.concat(g.memberIds); });
      var newGroup = { id:'CMB-'+memberIds.join('/'), memberIds:memberIds, type:'Combined footing' };
      newGroup.size = sizeFooting(newGroup, state.points, state.settings);
      newGroup.checks = runChecks(newGroup, newGroup.size, state.points, state.settings);
      state.groups = state.groups.filter(function(g){return checked.indexOf(g.id)===-1;});
      state.groups.push(newGroup);
      showToast('Merged '+checked.length+' groups into '+newGroup.id+'.');
      renderPhase();
      break;
    }
    case 'split-group': {
      var id = el.dataset.id;
      var g = state.groups.filter(function(gg){return gg.id===id;})[0];
      if(!g || g.memberIds.length<2) break;
      state.groups = state.groups.filter(function(gg){return gg.id!==id;});
      g.memberIds.forEach(function(mid){
        var ng = {id:'ISO-'+mid, memberIds:[mid], type:'Isolated footing'};
        ng.size = sizeFooting(ng, state.points, state.settings);
        ng.checks = runChecks(ng, ng.size, state.points, state.settings);
        state.groups.push(ng);
      });
      showToast('Split '+id+' back into '+g.memberIds.length+' isolated footings.');
      renderPhase();
      break;
    }
    case 'auto-group': {
      state.groups = autoGroup(state.points).map(function(g){
        g.size = sizeFooting(g, state.points, state.settings);
        g.checks = runChecks(g, g.size, state.points, state.settings);
        return g;
      });
      showToast('Groups recomputed from current elements.');
      renderPhase();
      break;
    }
    case 'recheck-group': {
      var rid = el.dataset.id;
      var rg = state.groups.filter(function(gg){return gg.id===rid;})[0];
      if(!rg) break;
      rg.manualSize = true;
      rg.checks = runChecks(rg, rg.size, state.points, state.settings);
      showToast('Rechecked '+rid+' with the current size.');
      renderPhase();
      break;
    }
    case 'autosize-all': {
      state.groups.forEach(function(g){
        g.manualSize = false;
        g.size = sizeFooting(g, state.points, state.settings);
        g.checks = runChecks(g, g.size, state.points, state.settings);
      });
      showToast('All footings auto-sized from current loads.');
      renderPhase();
      break;
    }
    case 'select-check-detail': {
      state._checkDetailId = el.value;
      document.getElementById('checkDetail').innerHTML = renderCheckDetail();
      break;
    }
    case 'plan-zoom': zoomPlan(parseFloat(el.dataset.factor)); break;
    case 'plan-fit': fitPlan(); break;
    case 'plan-locate': {
      var val = document.getElementById('locateInput').value.trim();
      var pt = state.points.filter(function(pp){return pp.id.toLowerCase()===val.toLowerCase();})[0];
      if(pt){ locatePoint(pt); pingPoint(pt.id); } else { showToast('No element with ID "'+val+'" found.'); }
      break;
    }
    case 'toggle-cond': {
      state.showConditions[el.dataset.cond] = el.checked;
      document.getElementById('planWrap').innerHTML = renderPlanSVG();
      attachPlanEvents();
      break;
    }
    case 'select-drawing': {
      state._drawId = el.value;
      document.getElementById('drawWrap').innerHTML = renderDrawing(state._drawId);
      break;
    }
    case 'validate': renderPhase(); showToast('Re-validated.'); break;
    case 'download-e2k': downloadText(sanitizeFilename(state.settings.projectName)+'-safe-export.txt', generateE2KText()); break;
    case 'download-summary': downloadText(sanitizeFilename(state.settings.projectName)+'-design-summary.csv', generateSummaryCSV()); break;
    case 'download-reactions': downloadText(sanitizeFilename(state.settings.projectName)+'-reactions.csv', generateReactionsCSV()); break;
    case 'save-project': saveProjectLocal(); break;
    case 'load-project': loadProjectLocal(); renderAll(); break;
  }
}

/* ---------------------------------------------------------------------- */
/* Init                                                                   */
/* ---------------------------------------------------------------------- */

function init(){
  renderAll();
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(el && !el.disabled) handleAction(el.dataset.action, el);
  });
  document.addEventListener('change', function(e){
    var bindEl = e.target.closest('[data-bind]');
    if(bindEl) handleBind(bindEl);
    var actionEl = e.target.closest('[data-action]');
    if(actionEl && actionEl!==bindEl && (actionEl.tagName==='SELECT' || actionEl.type==='checkbox')) handleAction(actionEl.dataset.action, actionEl);
  });
  document.addEventListener('input', function(e){
    var bindEl = e.target.closest('[data-bind]');
    if(bindEl && bindEl.tagName==='INPUT' && (bindEl.type==='text'||bindEl.type==='number')) handleBind(bindEl);
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target && e.target.id==='locateInput'){
      e.preventDefault();
      handleAction('plan-locate', document.querySelector('[data-action="plan-locate"]'));
    }
  });
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  initDownloads();
}
init();

})();
</script>
